function setStatus(s,g,id,status){if(!D.groups[g]?.items.some(x=>x[0]===id)||!["yes","no","unknown"].includes(status))return false;let a=s.selected[g].filter(k=>k!==id),b=s.absent[g].filter(k=>k!==id);if(status==="yes"){for(const pair of D.conflicts[g])if(pair.includes(id))a=a.filter(k=>!pair.includes(k));a.push(id)}else if(status==="no")b.push(id);s.selected[g]=a;s.absent[g]=b;return true}
function getStatus(s,g,id){return s.selected[g].includes(id)?"yes":s.absent[g].includes(id)?"no":"unknown"}
function report(s){return D.groups.map((g,i)=>({title:g.title,theme:g.theme,reviewed:s.reviewed[i],items:g.items.filter(v=>s.selected[i].includes(v[0])),absent:g.items.filter(v=>s.absent[i].includes(v[0])),unknown:g.items.filter(v=>getStatus(s,i,v[0])==="unknown"),questions:D.questions[i]}))}

const THEME_TEXT={"Масштаб":"Размер задаёт композицию и видимость объекта. Обсудите выбор масштаба, не связывая его с самооценкой.","Форма":"Форма отражает устройство изображённого объекта и художественный замысел.","Строение":"Детали строения помогают описать вымышленное существо и функции его частей.","Детализация":"Проработанные детали дают материал для рассказа; их количество зависит от техники и времени.","Восприятие":"Органы чувств в образе существа позволяют обсуждать способы получения информации в вымышленном мире.","Название":"Имя помогает понять авторский замысел и историю персонажа.","Движение":"Изображённые части и позы задают способы перемещения в сюжете.","Среда":"Окружение определяет условия действия в рассказе; уточните их по словам автора.","Защита":"Защитные элементы имеют возможные функции в вымышленной среде. Не переносите их на психологию автора.","Функции":"Детали позволяют обсудить предполагаемые функции объекта в истории.","Потребности":"Названные потребности относятся к вымышленному существу и его условиям жизни.","Взаимодействие":"Показанные действия и контакты позволяют обсуждать конкретные отношения персонажей, но не устанавливают отношения автора.","Композиция":"Расположение объектов описывает организацию пространства; возможны разные художественные причины.","Сюжет":"Отмеченные события помогают понять историю, которую рассказывает автор.","Техника":"Линии, исправления и детали относятся к способу выполнения и материалам.","Материалы":"Выбранные материалы влияют на цвет, фактуру и вид линий.","Условия":"Условия выполнения следует учитывать при обсуждении; они могут влиять на результат.","Поза":"Поза описывает положение героя в сцене; её причины уточняются по рассказу.","Действие":"Отмеченные действия или прямо названные шаги позволяют обсудить содержание сцены или плана.","Выражение":"Видимые черты лица можно обсуждать как часть образа героя, не приписывая автору эмоции.","Окружение":"Предметы и другие герои уточняют место действия и возможный сюжет.","Погода":"Погодные детали задают обстоятельства сцены; они не измеряют психологическое состояние.","Средства защиты":"Изображённые средства защиты позволяют обсудить их доступность и использование персонажем в сцене.","Рассказ":"Здесь важно опираться на прямо сказанное автором и не дополнять его рассказ предположениями о личности.","Расстояние":"Расположение фигур относительно друг друга описывает композицию и может зависеть от сюжета, перспективы и размера листа.","Интересы":"В записи назван интерес. Можно уточнить, что в нём важно и какое место он занимает в жизни.","Ценности":"В записи прямо обозначена ценность. Уточните её личный смысл и проявление в действиях.","Развитие":"Названное направление обучения может стать предметом планирования и рефлексии.","Ресурсы":"Автор прямо назвал ресурс или условие. Можно обсудить его доступность и способы использования.","Приоритеты":"Названная цель или желаемое изменение даёт основу для обсуждения дальнейших действий.","Границы":"Прямо сформулированная граница позволяет обсудить её содержание и уважительное выражение.","Уточнение":"Неопределённость в записи — повод уточнить вопрос, а не делать вывод о личности."},PATTERNS=[{"g":0,"ids":["center","edge"],"title":"Композиция — сочетание","text":"Совместно отмечены: основная группа расположена в центре; группа или фигуры касаются края листа. Расположение объектов описывает организацию пространства; возможны разные художественные причины. Обсудите связь этих деталей с автором."},{"g":0,"ids":["near","apart"],"title":"Расстояние — сочетание","text":"Совместно отмечены: некоторые фигуры находятся рядом; некоторые фигуры находятся на расстоянии. Расположение фигур относительно друг друга описывает композицию и может зависеть от сюжета, перспективы и размера листа. Обсудите связь этих деталей с автором."},{"g":0,"ids":["sameSize","diffSize"],"title":"Масштаб — сочетание","text":"Совместно отмечены: фигуры примерно одинакового размера; фигуры заметно различаются по размеру. Размер задаёт композицию и видимость объекта. Обсудите выбор масштаба, не связывая его с самооценкой. Обсудите связь этих деталей с автором."},{"g":0,"ids":["ground","objects"],"title":"Среда — сочетание","text":"Совместно отмечены: обозначено пространство или поверхность; изображены предметы или помещение. Окружение определяет условия действия в рассказе; уточните их по словам автора. Обсудите связь этих деталей с автором."},{"g":1,"ids":["named","self"],"title":"Рассказ — сочетание","text":"Совместно отмечены: автор обозначил роли персонажей словами; автор прямо сказал, что изобразил себя. Здесь важно опираться на прямо сказанное автором и не дополнять его рассказ предположениями о личности. Обсудите связь этих деталей с автором."},{"g":1,"ids":["faces","clothes"],"title":"Детализация — сочетание","text":"Совместно отмечены: у фигур видны черты лиц; у фигур есть заметные детали одежды. Проработанные детали дают материал для рассказа; их количество зависит от техники и времени. Обсудите связь этих деталей с автором."},{"g":2,"ids":["joint","separate"],"title":"Действие — сочетание","text":"Совместно отмечены: показано совместное занятие; показаны разные занятия. Отмеченные действия или прямо названные шаги позволяют обсудить содержание сцены или плана. Обсудите связь этих деталей с автором."},{"g":2,"ids":["hands","talk"],"title":"Взаимодействие — сочетание","text":"Совместно отмечены: некоторые фигуры держатся за руки; автор описывает разговор персонажей. Показанные действия и контакты позволяют обсуждать конкретные отношения персонажей, но не устанавливают отношения автора. Обсудите связь этих деталей с автором."},{"g":2,"ids":["problem","ending"],"title":"Сюжет — сочетание","text":"Совместно отмечены: автор прямо назвал трудность в сюжете; автор описал продолжение сцены. Отмеченные события помогают понять историю, которую рассказывает автор. Обсудите связь этих деталей с автором."},{"g":3,"ids":["erase","simple"],"title":"Техника — сочетание","text":"Совместно отмечены: есть исправления; рисунок выполнен схематично. Линии, исправления и детали относятся к способу выполнения и материалам. Обсудите связь этих деталей с автором."},{"g":3,"ids":["prompt","time"],"title":"Условия — сочетание","text":"Совместно отмечены: использованы подсказки или образец; были ограничения времени. Условия выполнения следует учитывать при обсуждении; они могут влиять на результат. Обсудите связь этих деталей с автором."}];
function interpretation(s,only=null){return report(s).map((g,i)=>{const by=new Map();for(const v of g.items){if(!by.has(v[2]))by.set(v[2],[]);by.get(v[2]).push(v[1])}return {i,title:g.title,yes:g.items.length,no:g.absent.length,unknown:g.unknown.length,entries:[...by].map(([name,observations])=>({name,observations,text:THEME_TEXT[name]||"Уточните значение этих деталей в рассказе автора и условия выполнения."})),patterns:PATTERNS.filter(p=>p.g===i&&p.ids.every(id=>s.selected[i].includes(id)))}}).filter(g=>only===null||g.i===only)}
const LIMIT="Предварительная тематическая интерпретация, не психологическое заключение. Темы относятся к наблюдаемым деталям и явно высказанным смыслам; не устанавливают свойства личности.";
function primaryText(s,only=null){return ["ПЕРВИЧНАЯ ИНТЕРПРЕТАЦИЯ",LIMIT,...interpretation(s,only).flatMap(g=>["","== "+g.title+" ==","Да: "+g.yes+"; Нет: "+g.no+"; Неясно: "+g.unknown,...(g.yes?g.entries.flatMap(e=>[e.name+": "+e.text,"Основание: "+e.observations.join("; ")]):["Нет подтверждённых наблюдений для тематической интерпретации."]),...g.patterns.flatMap(p=>["Сочетание признаков — "+p.title+": "+p.text])])].join("\n")}
function primaryHTML(s,only=null){return '<div class="primary-reading"><div class="tag">Первичная интерпретация</div><p class="reading-limit">'+esc(LIMIT)+'</p>'+interpretation(s,only).map(g=>'<section class="reading-group"><h3>'+esc(g.title)+'</h3><small>Да: '+g.yes+' · Нет: '+g.no+' · Неясно: '+g.unknown+'</small>'+(g.yes?g.entries.map(e=>'<div class="reading-entry"><strong>'+esc(e.name)+'</strong><p>'+esc(e.text)+'</p><small>Основание: '+esc(e.observations.join("; "))+'</small></div>').join(""):'<p>Нет подтверждённых наблюдений для тематической интерпретации.</p>')+g.patterns.map(p=>'<div class="reading-pattern"><strong>Сочетание признаков: '+esc(p.title)+'</strong><p>'+esc(p.text)+'</p></div>').join("")+'</section>').join("")+'</div>'}
function openPrimary(){const d=$("primaryDialog");$("dialogContent").innerHTML=primaryHTML(state);if(typeof d.showModal==="function")d.showModal();else d.setAttribute("open","")}
function navigate(n){if(n<0||n>5||n>state.max)return;state.step=n;render();if(typeof window.scrollTo==="function")window.scrollTo(0,0)}
function advance(){if(state.step>0&&state.step<5)state.reviewed[state.step-1]=true;state.max=Math.max(state.max,state.step+1);navigate(state.step+1)}
function shell(content){app.innerHTML='<section class="panel"><div class="row"><span class="tag">Этап '+(state.step+1)+' / 6</span><span class="count">'+checked(state)+' / 30 уточнено</span></div><div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="6" aria-valuenow="'+(state.step+1)+'"><i style="width:'+((state.step+1)/6*100)+'%"></i></div><nav class="steps noprint" aria-label="Этапы">'+names.map((n,i)=>'<button data-step="'+i+'" '+(i>state.max?'disabled':'')+(i===state.step?' aria-current="step"':'')+'>'+n+'</button>').join("")+'</nav>'+content+'</section>';app.querySelectorAll("[data-step]").forEach(b=>b.onclick=()=>navigate(+b.dataset.step))}
const icons=['<path d="M4 24 28 5 52 24M11 22v29h34V22M23 51V34h10v17M15 28h7v7h-7M36 28h7v7h-7"/>','<path d="M28 51V28M28 39l-11-9M28 32l11-9M11 51h34"/><path d="M16 31C2 30 3 15 15 13 17 1 37 1 41 14 54 15 55 34 40 35"/>','<circle cx="28" cy="10" r="7"/><path d="M28 17v19M10 27l18-6 18 6M28 36 16 51M28 36l12 15"/>'];
function intro(){shell("<h1>Рисунок семьи</h1><p>Рисуночное упражнение для обсуждения изображения семьи и рассказа автора. Авторская адаптация для рефлексии, не стандартизированный тест.</p><div class=\"note\"><h3>Инструкция</h3><ol><li>Возьмите чистый лист бумаги и карандаш.</li><li>Нарисуйте семью так, как вы её представляете. Это может быть реальная или вымышленная семья; не обязательно указывать имена.</li><li>На бумаге запишите, кто изображён, что происходит и какую историю вы хотели показать. Не оценивайте качество рисунка.</li><li>После этого откройте чек-листы. Обсуждение чужого рисунка возможно только с добровольного согласия автора.</li></ol></div><div class=\"note warning\"><strong>Ограничения</strong><p>Не устанавливайте диагноз, личностные свойства или скрытые намерения по отдельным признакам. Не используйте для отбора, медицинских, судебных решений или оценки детей. Обсуждайте чужие материалы только с добровольного согласия автора.</p></div><p class=\"count\">30 признаков · 4 чек-листа · первичная интерпретация · экспорт. Ответы и рисунки не загружаются на сервер.</p><label class=\"check\"><input type=\"checkbox\" id=\"ready\"><span>Задание выполнено. Можно перейти к наблюдениям.</span></label><button id=\"begin\" class=\"primary wide\" disabled>Открыть чек-листы →</button>");$("ready").checked=state.max>0;$("begin").disabled=!$("ready").checked;$("ready").onchange=()=>$("begin").disabled=!$("ready").checked;$("begin").onclick=advance}
function checklist(i){const g=D.groups[i];shell('<h1>'+esc(g.title)+'</h1><p>'+esc(g.intro)+'</p><div class="row"><span class="pill" id="groupCount"></span><button id="clear">Сбросить раздел</button></div><p class="count">Да — признак непосредственно наблюдается; Нет — вы уверены, что он не соответствует рисунку; Неясно — не можете оценить. Для взаимоисключающих признаков новая отметка «Да» сбрасывает прежнюю «Да» в «Неясно». Неясные признаки не интерпретируются.</p><div class="row noprint"><label for="filter">Показать</label><select id="filter"><option value="all">Все признаки</option><option value="unknown">Неясные</option><option value="yes">Отмеченные «Да»</option><option value="no">Отмеченные «Нет»</option></select></div><div class="preview-tools noprint"><button id="showPrimary" class="primary wide">Открыть общую первичную интерпретацию</button><details open id="liveDetails"><summary>Первичная интерпретация раздела</summary><div id="livePrimary" aria-live="polite"></div></details></div><div id="checks">'+g.items.map((v,j)=>'<fieldset class="tri" data-row="'+j+'"><legend>'+esc(v[1])+'</legend><div class="tri-options">'+[["yes","Да"],["no","Нет"],["unknown","Неясно"]].map(([k,label])=>'<label><input type="radio" name="item'+j+'" data-item="'+j+'" value="'+k+'" '+(getStatus(state,i,v[0])===k?'checked':'')+'><span>'+label+'</span></label>').join("")+'</div></fieldset>').join("")+'</div><details><summary>Уточняющие вопросы</summary><p>Запишите ответы на бумаге. Не подсказывайте интерпретацию.</p><ol>'+D.questions[i].map(q=>'<li>'+esc(q)+'</li>').join("")+'</ol></details><div class="row"><button id="prev">← Назад</button><button class="primary" id="next">'+(i===3?'Сформировать отчёт':'Следующий раздел')+' →</button></div>');const sync=()=>{const v=stats(state,i);$("groupCount").textContent="Да: "+v.yes+" · Нет: "+v.no+" · Неясно: "+v.unknown;app.querySelector(".count").textContent=checked(state)+" / "+D.groups.reduce((n,g)=>n+g.items.length,0)+" уточнено";$("livePrimary").innerHTML=primaryHTML(state,i);const filter=$("filter").value;$("checks").querySelectorAll("input").forEach(b=>b.checked=getStatus(state,i,g.items[+b.dataset.item][0])===b.value);$("checks").querySelectorAll("[data-row]").forEach(el=>el.hidden=filter!=="all"&&getStatus(state,i,g.items[+el.dataset.row][0])!==filter)};$("checks").querySelectorAll("input").forEach(b=>b.onchange=()=>{if(b.checked){setStatus(state,i,g.items[+b.dataset.item][0],b.value);sync()}});$("filter").onchange=sync;$("showPrimary").onclick=openPrimary;$("clear").onclick=()=>{if(confirm("Сбросить ответы в этом разделе?")){state.selected[i]=[];state.absent[i]=[];sync()}};$("prev").onclick=()=>navigate(state.step-1);$("next").onclick=advance;sync()}
function reportText(s){const r=report(s);return ["YUGATNEO — Рисунок семьи 1.0","Протокол наблюдений, не психологическое заключение.","Дата: "+new Date().toLocaleDateString("ru-RU"),"Уточнено: "+checked(s)+" из "+D.groups.reduce((n,g)=>n+g.items.length,0),primaryText(s), "", "ПОДРОБНЫЙ ПРОТОКОЛ",...r.flatMap(g=>["","== "+g.title+" ==","Да: "+g.items.length+"; Нет: "+g.absent.length+"; Неясно: "+g.unknown.length,"Тема: "+g.theme,...g.items.flatMap(v=>["Наблюдение: "+v[1],"Вопрос: "+v[3],"Альтернативное объяснение: "+v[4]]),"Нет:",...g.absent.map(v=>"- "+v[1]),"Неясно:",...g.unknown.map(v=>"- "+v[1]),"Вопросы к автору:",...g.questions.map(q=>"- "+q)]),"","Повторяющиеся темы для обсуждения:",...topics(s).map(([t,g])=>t+": "+g.join(", ")),"","Итог на бумаге: наблюдение; значение по словам автора; альтернативное объяснение; открытый вопрос. Не делайте клинических выводов по деталям."].join("\n")}
function output(){const r=report(state),total=D.groups.reduce((n,g)=>n+g.items.length,0),n=checked(state),t=topics(state);shell('<h1>Протокол наблюдений</h1><div id="primaryReport">'+primaryHTML(state)+'</div><div class="grid metrics"><div class="tile"><strong>'+count(state)+'</strong><small>Да</small></div><div class="tile"><strong>'+(n-count(state))+'</strong><small>Нет</small></div><div class="tile"><strong>'+(total-n)+'</strong><small>Неясно</small></div></div><p>Уточнено '+n+' из '+total+' пунктов. Это полнота заполнения, а не психологический балл.</p><div class="note"><strong>Принцип интерпретации</strong><p>Отмеченные «Да» признаки сопровождаются открытыми вопросами и возможными непсихологическими объяснениями. Значение уточняется по словам автора. «Нет» и «Неясно» не превращаются в психологические выводы.</p></div>'+r.map((g,i)=>'<details open><summary>'+esc(g.title)+' · '+g.items.length+' / '+(g.items.length+g.absent.length+g.unknown.length)+' «Да»</summary><p>Темы для обсуждения: '+esc(g.theme)+'</p>'+(g.items.length?g.items.map(v=>'<div class="report-item"><strong>'+esc(v[1])+'</strong><p><b>Вопрос:</b> '+esc(v[3])+'</p><p><small><b>Альтернативное объяснение:</b> '+esc(v[4])+'</small></p></div>').join(""):'<p>Нет отмеченных «Да» признаков.</p>')+'<details><summary>Ответы «Нет» ('+g.absent.length+') и «Неясно» ('+g.unknown.length+')</summary><p><b>Нет:</b> '+(g.absent.map(v=>esc(v[1])).join("; ")||"—")+'</p><p><b>Неясно:</b> '+(g.unknown.map(v=>esc(v[1])).join("; ")||"—")+'</p></details><h3>Вопросы к автору</h3><ol>'+g.questions.map(q=>'<li>'+esc(q)+'</li>').join("")+'</ol><button class="wide noprint" data-edit="'+i+'">Редактировать чек-лист</button></details>').join("")+'<div class="note"><strong>Повторяющиеся темы для обсуждения</strong><p>Это общие категории наблюдений в нескольких рисунках, а не совпадение психологических признаков.</p>'+(t.length?'<ul>'+t.map(([k,g])=>'<li>'+esc(k)+': '+esc(g.join(", "))+'</li>').join("")+'</ul>':'<p>Общие категории по отмеченным признакам не выделены.</p>')+'</div><div class="note"><strong>Итоговая письменная рефлексия</strong><ol><li>Что действительно изображено?</li><li>Как сам автор объясняет значение деталей?</li><li>Какие другие объяснения возможны?</li><li>Какой вопрос хочется исследовать дальше?</li></ol></div><div class="row"><button id="txt">Сохранить TXT</button><button id="print">Печать / PDF</button></div><div class="row" style="margin-top:8px"><button id="restart">Новая сессия</button><button id="copy">Копировать протокол</button></div><p class="status" id="notice" role="status"></p><details><summary>Ограничения метода</summary><p>Данный чек-лист — авторская адаптация для наблюдения и обсуждения, а не стандартизированная диагностическая методика. Нельзя устанавливать диагноз, характер, скрытые намерения или травму по рисунку либо письменному упражнению.</p><p><a href="https://pubmed.ncbi.nlm.nih.gov/?term=projective+techniques+validity" target="_blank" rel="noopener">Поиск исследований валидности проективных методик в PubMed</a></p></details>');app.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>navigate(+b.dataset.edit+1));$("txt").onclick=()=>{try{const u=URL.createObjectURL(new Blob([reportText(state)],{type:"text/plain;charset=utf-8"}));const a=document.createElement("a");a.href=u;a.download="family-drawing-report.txt";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000)}catch{$("notice").textContent="Не удалось создать файл. Используйте печать или копирование."}};$("print").onclick=()=>{app.querySelectorAll("details").forEach(d=>d.open=true);window.print()};$("copy").onclick=async()=>{try{await navigator.clipboard.writeText(reportText(state));$("notice").textContent="Протокол скопирован."}catch{$("notice").textContent="Буфер обмена недоступен. Используйте TXT."}};$("restart").onclick=()=>{if(confirm("Начать новую сессию? Отметки будут сброшены.")){state=fresh();render()}}}
$("closePrimary").onclick=()=>{const d=$("primaryDialog");if(typeof d.close==="function")d.close();else d.removeAttribute("open")};
function render(){if(state.step===0)intro();else if(state.step===5)output();else checklist(state.step-1)}
render();
</script></body></html>
