const D={"groups":[{"title":"Дом","theme":"Пространство, принадлежность, отношения","intro":"Рассмотрите рисунок дома. Отмечайте только то, что действительно видно.","items":[["sizeSmall","Дом занимает небольшую часть листа","Масштаб и пространство","Как вы выбирали размер дома? Какое место он занимает в вашей истории?","Размер может зависеть от привычки рисовать мелко или от формата листа."],["sizeLarge","Дом занимает большую часть листа","Масштаб и пространство","Что для вас важно в таком размере дома?","Размер может отражать художественный замысел или желание заполнить лист."],["edge","Дом касается края листа или выходит за него","Композиция","Как вы представляете продолжение рисунка за пределами листа?","Может быть результатом планирования композиции."],["door","Видна дверь","Доступ и взаимодействие","Кто может войти в этот дом? Как это происходит?","Дверь — обычная архитектурная деталь."],["noDoor","Дверь не изображена","Доступ и взаимодействие","Где находится вход, если он есть? Как люди попадают внутрь?","Вход может быть на невидимой стороне здания."],["window","Видны окна","Связь с окружением","Что можно увидеть из окон? Что находится снаружи?","Число окон зависит от типа здания и выбранного ракурса."],["noWindow","Окна не изображены","Связь с окружением","Есть ли окна на других сторонах дома? Что вы хотели показать?","Условное изображение или ракурс могут исключать окна."],["roof","Крыша выделена деталями","Конструкция и замысел","Что представляет собой эта крыша? Почему вы её так изобразили?","Возможны архитектурный интерес и привычный способ рисовать."],["fence","Есть забор, ограда или ворота","Границы пространства","Каково назначение ограды в этой истории? Кто ею пользуется?","Ограда может быть обычным элементом знакомого пейзажа."],["path","Есть дорожка или ступени","Связь с окружением","Куда ведёт эта дорожка? Кто по ней ходит?","Дорожка может служить композиционной деталью."],["chimney","Есть труба или дым","Обстановка дома","Что происходит внутри дома в данный момент?","Дым может обозначать сезон, отопление или традиционный образ дома."],["surround","Нарисованы растения, другие здания или предметы рядом","Окружение","Что находится вокруг дома и какую роль играет?","Дополнительные детали могут просто дополнять пейзаж."],["details","Много мелких архитектурных деталей","Детализация","Какие детали оказались особенно интересными для вас?","Уровень детализации связан с опытом рисования, временем и задачей."],["perspective","Дом изображён в перспективе или с нескольких сторон","Ракурс","Почему выбран именно этот ракурс?","Перспектива может зависеть от навыка и визуального образца."],["center","Дом расположен примерно в центре листа","Композиция","Почему вы выбрали такое место для дома?","Центральная композиция распространена в рисунках."],["upper","Дом расположен преимущественно в верхней половине листа","Композиция","Что находится или могло бы находиться ниже дома?","Расположение может зависеть от планирования листа."],["lower","Дом расположен преимущественно в нижней половине листа","Композиция","Как вы представляете пространство над домом?","Может быть выбран горизонт или оставлено место для неба."],["doorOpen","Дверь явно изображена открытой","Вход","Что происходит у входа?","Открытая дверь может быть сюжетной деталью."],["doorClosed","Дверь явно изображена закрытой","Вход","Что находится за дверью, если это известно автору?","Закрытые двери обычны в изображении фасада."],["curtains","Видны шторы, ставни или жалюзи","Окна","Для чего нужны эти детали в вашем рисунке?","Возможна передача знакомого интерьера или архитектуры."],["material","Обозначен материал стен (кирпич, доски и т. п.)","Конструкция","Из чего построен дом? Почему вы выбрали этот материал?","Может отражать знания о строительстве или художественный приём."],["multiple","Дом имеет несколько этажей","Конструкция","Что происходит на разных этажах?","Количество этажей зависит от типа здания."]]},{"title":"Дерево","theme":"Рост, окружение, ресурсы","intro" const esc=x=>String(x).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function fresh(){return {step:0,max:0,selected:D.groups.map(()=>[]),absent:D.groups.map(()=>[]),reviewed:D.groups.map(()=>false)}}
let state=fresh();
function setStatus(s,g,id,status){if(!D.groups[g]?.items.some(x=>x[0]===id)||!["yes","no","unknown"].includes(status))return false;let a=s.selected[g].filter(k=>k!==id),b=s.absent[g].filter(k=>k!==id);if(status==="yes"){for(const pair of D.conflicts[g])if(pair.includes(id))a=a.filter(k=>!pair.includes(k));a.push(id)}else if(status==="no")b.push(id);s.selected[g]=a;s.absent[g]=b;return true}
function getStatus(s,g,id){return s.selected[g].includes(id)?"yes":s.absent[g].includes(id)?"no":"unknown"}
function report(s){return D.groups.map((g,i)=>({title:g.title,theme:g.theme,reviewed:s.reviewed[i],items:g.items.filter(v=>s.selected[i].includes(v[0])),absent:g.items.filter(v=>s.absent[i].includes(v[0])),unknown:g.items.filter(v=>getStatus(s,i,v[0])==="unknown"),questions:D.questions[i]}))}
function count(s){return s.selected.reduce((n,a)=>n+a.length,0)}
function checked(s){return count(s)+s.absent.reduce((n,a)=>n+a.length,0)}
function stats(s,i){const y=s.selected[i].length,n=s.absent[i].length;return {yes:y,no:n,unknown:D.groups[i].items.length-y-n}}
function topics(s){const r=report(s),result=new Map();for(const g of r)for(const v of g.items){if(!result.has(v[2]))result.set(v[2],new Set());result.get(v[2]).add(g.title)}return [...result].filter(([_,a])=>a.size>1).map(([theme,a])=>[theme,[...a]])}
const THEME_TEXT={"Масштаб и пространство":"Размер дома определяет, сколько места он занимает в изображённом мире. Это повод обсудить значимость дома в сюжете, а не самооценку автора.","Композиция":"Положение объекта задаёт организацию пространства рисунка. Можно обсудить, почему автор оставил свободное место или выбрал именно этот ракурс.","Доступ и взаимодействие":"Изображение входа или его отсутствие задаёт тему доступа к дому: кто может входить, при каких условиях и для чего. Открытость личности из этого не следует.","Связь с окружением":"Окна и пути связывают внутреннее пространство с внешней средой. В рассказе автора можно уточнить, что находится по обе стороны этой границы.","Конструкция и замысел":"Выделенная крыша может быть важной частью архитектуры или сюжета. Следует уточнить её назначение.","Границы пространства":"Ограда организует границу изображённого пространства. Она может служить защите, обозначению территории или обычному оформлению участка.","Обстановка дома":"Труба или дым добавляют информацию о происходящем в доме, например об отоплении или сезоне.","Окружение":"Соседние объекты помогают описать среду, в которую автор поместил изображение, и возможные связи между ними.","Детализация":"Количество и характер деталей показывают, какие элементы изображения были проработаны. Это может зависеть от интереса к теме, техники или времени.","Ракурс":"Ракурс определяет, какие детали видимы, а какие скрыты. Отсутствие детали следует рассматривать с учётом выбранной точки зрения.","Вход":"Состояние двери уточняет сцену доступа в дом. Возможный сюжет — вход, выход или закрытое помещение; значение определяется рассказом автора.","Окна":"Шторы, ставни и другие элементы окна позволяют обсудить освещение, видимость и назначение помещения.","Конструкция":"Материалы и этажность уточняют устройство здания. Они могут описывать знакомую архитектуру или воображаемую среду.","Масштаб":"Размер объекта относится к композиции и изображённому миру. Сам по себе он не свидетельствует об уверенности или неуверенности автора.","Опора и условия роста":"Корни и их видимость позволяют обсудить почву, условия роста и устойчивость самого дерева. Это не мера психологической опоры автора.","Среда":"Линия земли, погода и контейнер задают условия существования объекта. Можно уточнить, какие условия помогают или мешают ему в сюжете.","Строение":"Особенности ствола и ветвления описывают форму растения, его возможный вид и возраст.","Развитие формы":"Направление ветвей задаёт пространственную форму дерева. Можно исследовать, как автор представляет его развитие.","Сезон и рост":"Листва или её отсутствие могут задавать сезон, вид растения или стадию его жизненного цикла.","Жизненный цикл":"Плоды, цветы и шишки могут быть частью истории роста и размножения дерева. Уточните их роль в замысле автора.","Особенности строения":"Дупло — заметная особенность формы дерева. Оно может быть жилищем животного, следом природного процесса или частью вымысла.","История дерева":"Изображённое повреждение даёт повод узнать историю самого дерева. Оно не является свидетельством пережитой автором травмы.","Форма":"Наклон, изгиб и симметрия определяют визуальный характер дерева. Возможны природные причины или стилизация.","Образ персонажа":"Изображение лица помогает установить, кто персонаж в истории. Не следует считать его автопортретом без слов автора.","Выражение":"Черты лица могут передавать выражение персонажа. Описание эмоций следует уточнять у автора, не переносить их автоматически на него.","Ракурс и детализация":"Невидимые черты лица могут объясняться ракурсом или упрощением. Их психологическое значение по рисунку не определяется.","Действия":"Поза и кисти рук помогают обсуждать действия изображённого человека, его занятие и сюжет.","Действия и ракурс":"Невидимые кисти могут быть следствием положения рук, кадрирования или техники рисования; уточните действие персонажа.","Положение в пространстве":"Видимость стоп и обуви определяет, как показан персонаж в пространстве; уточните его позу, опору и направление движения.","Контекст":"Одежда может сообщать о ситуации, сезоне или роли персонажа. Не следует выводить свойства автора из одежды фигуры.","Занятия":"Предметы и аксессуары позволяют узнать, чем занят изображённый человек и для чего ему нужны эти вещи.","Детализация лица":"Глаза и рот могут задавать направление взгляда и выражение лица. Их смысл уточняется в рассказе о персонаже.","Внешний образ":"Причёска и другие внешние детали могут уточнять образ персонажа, стиль или замысел.","Процесс":"Исправления и поворот листа показывают способы выполнения задания. Они не доказывают нерешительность или иной устойчивый признак личности.","Техника":"Нажим, штриховка и обведение относятся к графической технике; возможны влияние инструмента, материала и художественного замысла.","Стиль":"Схематичность и детализация описывают визуальный стиль, а не уровень интеллекта или личностные особенности.","Условия":"Темп, перерывы и помощь описывают обстоятельства выполнения. Эти обстоятельства необходимо учитывать прежде, чем обсуждать изображение.","Сравнение":"Сходства и различия между рисунками относятся к их форме и стилю. Они могут возникать из-за различия заданий или материалов.","Материалы":"Материалы влияют на цвет, толщину и выраженность линий. Выбор материала сам по себе не даёт психологического заключения."},PATTERNS=[{"g":0,"ids":["noDoor","noWindow"],"title":"Доступ и видимость","text":"На изображённой стороне дома не показаны вход и окна. Возможная тема рассказа — устройство внутреннего и внешнего пространства, доступ к дому. Уточните ракурс и назначение здания; делать вывод об изоляции автора нельзя."},{"g":0,"ids":["fence","path"],"title":"Граница и путь","text":"Ограда и дорожка вместе задают маршрут к дому и границу участка. Можно обсудить, кому предназначен этот путь и как устроен доступ. Это описание сюжета, не характеристика доверия автора."},{"g":0,"ids":["doorOpen","window"],"title":"Связь внутреннего и внешнего","text":"Открытая дверь и окна формируют видимые связи дома с окружением. Уточните, что происходит в этой сцене и кто находится внутри."},{"g":1,"ids":["roots","ground"],"title":"Условия роста","text":"Корни и линия земли обозначают связь дерева с почвой. Можно обсудить условия, необходимые для роста этого дерева, и какие значения автор сам придаёт этим деталям."},{"g":1,"ids":["bare","broken"],"title":"Состояние дерева","text":"Листва отсутствует и изображены повреждения. Возможные объяснения включают сезон, особенности вида и события в истории дерева. Это не свидетельство эмоционального состояния автора."},{"g":1,"ids":["crown","fruit"],"title":"Сезон и жизненный цикл","text":"Крона с листьями и плоды или цветы позволяют обсудить стадию развития дерева и его место в окружающей среде."},{"g":2,"ids":["motion","objects"],"title":"Действие и занятие","text":"Движение и предметы могут уточнять действие персонажа. Можно спросить, какую задачу он выполняет и что произойдёт дальше."},{"g":2,"ids":["noFace","back"],"title":"Видимость лица","text":"Человек показан со спины, поэтому отсутствие черт лица согласуется с выбранным ракурсом. Не требуется искать психологическое объяснение этой особенности."},{"g":2,"ids":["noHands","profile"],"title":"Ракурс и кисти рук","text":"Профиль и отсутствие видимых кистей следует рассматривать вместе с позой и кадрированием. Уточните положение рук в изображённой сцене."},{"g":3,"ids":["pressure","hatch"],"title":"Выразительность линии","text":"Разная интенсивность линий и штриховка могут быть способом передачи формы, тени и фактуры. Сначала учитывайте материал и художественный приём."},{"g":3,"ids":["time","interrupt"],"title":"Влияние обстановки","text":"Стремление закончить быстро и внешние отвлечения могут влиять на детализацию и темп. Эти условия ограничивают любые дальнейшие интерпретации."}];
function interpretation(s,only=null){return report(s).map((g,i)=>{const by=new Map();for(const v of g.items){if(!by.has(v[2]))by.set(v[2],[]);by.get(v[2]).push(v[1])}return {i,title:g.title,yes:g.items.length,no:g.absent.length,unknown:g.unknown.length,entries:[...by].map(([name,observations])=>({name,observations,text:THEME_TEXT[name]||"Уточните значение этих деталей в рассказе автора и условия выполнения."})),patterns:PATTERNS.filter(p=>p.g===i&&p.ids.every(id=>s.selected[i].includes(id)))}}).filter(g=>only===null||g.i===only)}
const LIMIT="Предварительное тематическое прочтение рисунков, не психологическое заключение. Темы относятся к изображённому сюжету; личное значение подтверждается только словами автора.";
function primaryText(s,only=null){return ["ПЕРВИЧНАЯ ИНТЕРПРЕТАЦИЯ",LIMIT,...interpretation(s,only).flatMap(g=>["","== "+g.title+" ==","Да: "+g.yes+"; Нет: "+g.no+"; Неясно: "+g.unknown,...(g.yes?g.entries.flatMap(e=>[e.name+": "+e.text,"Основание: "+e.observations.join("; ")]):["Нет подтверждённых наблюдений для тематической интерпретации."]),...g.patterns.flatMap(p=>["Сочетание признаков — "+p.title+": "+p.text])])].join("\n")}
function primaryHTML(s,only=null){return '<div class="primary-reading"><div class="tag">Первичная интерпретация</div><p class="reading-limit">'+esc(LIMIT)+'</p>'+interpretation(s,only).map(g=>'<section class="reading-group"><h3>'+esc(g.title)+'</h3><small>Да: '+g.yes+' · Нет: '+g.no+' · Неясно: '+g.unknown+'</small>'+(g.yes?g.entries.map(e=>'<div class="reading-entry"><strong>'+esc(e.name)+'</strong><p>'+esc(e.text)+'</p><small>Основание: '+esc(e.observations.join("; "))+'</small></div>').join(""):'<p>Нет подтверждённых наблюдений для тематической интерпретации.</p>')+g.patterns.map(p=>'<div class="reading-pattern"><strong>Сочетание признаков: '+esc(p.title)+'</strong><p>'+esc(p.text)+'</p></div>').join("")+'</section>').join("")+'</div>'}
function openPrimary(){const d=$("primaryDialog");$("dialogContent").innerHTML=primaryHTML(state);if(typeof d.showModal==="function")d.showModal();else d.setAttribute("open","")}
function navigate(n){if(n<0||n>5||n>state.max)return;state.step=n;render();if(typeof window.scrollTo==="function")window.scrollTo(0,0)}
function advance(){if(state.step>0&&state.step<5)state.reviewed[state.step-1]=true;state.max=Math.max(state.max,state.step+1);navigate(state.step+1)}
function shell(content){app.innerHTML='<section class="panel"><div class="row"><span class="tag">Этап '+(state.step+1)+' / 6</span><span class="count">'+checked(state)+' / 82 уточнено</span></div><div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="6" aria-valuenow="'+(state.step+1)+'"><i style="width:'+((state.step+1)/6*100)+'%"></i></div><nav class="steps noprint" aria-label="Этапы">'+names.map((n,i)=>'<button data-step="'+i+'" '+(i>state.max?'disabled':'')+(i===state.step?' aria-current="step"':'')+'>'+n+'</button>').join("")+'</nav>'+content+'</section>';app.querySelectorAll("[data-step]").forEach(b=>b.onclick=()=>navigate(+b.dataset.step))}
const icons=['<path d="M4 24 28 5 52 24M11 22v29h34V22M23 51V34h10v17M15 28h7v7h-7M36 28h7v7h-7"/>','<path d="M28 51V28M28 39l-11-9M28 32l11-9M11 51h34"/><path d="M16 31C2 30 3 15 15 13 17 1 37 1 41 14 54 15 55 34 40 35"/>','<circle cx="28" cy="10" r="7"/><path d="M28 17v19M10 27l18-6 18 6M28 36 16 51M28 36l12 15"/>'];
function intro(){shell('<h1>Дом, дерево, человек</h1><p>Цифровой протокол наблюдения и обсуждения рисунков по мотивам проективной методики HTP Джона Бака. Это не стандартизированная диагностика.</p><div class="grid">'+["Дом","Дерево","Человек"].map((n,i)=>'<div class="tile"><svg viewBox="0 0 56 56" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">'+icons[i]+'</svg>'+n+'</div>').join("")+'</div><div class="note"><h3>Инструкция к рисованию</h3><ol><li>Подготовьте три чистых листа бумаги одинакового формата, простой карандаш и ластик.</li><li>На первом листе нарисуйте дом, на втором — дерево, на третьем — человека целиком. Рисуйте так, как вам удобно. Художественные способности не оцениваются.</li><li>Не используйте образцы и не изучайте признаки заранее. Не ограничивайте себя искусственно по времени.</li><li>После завершения всех рисунков откройте чек-листы и отмечайте только непосредственно наблюдаемые признаки.</li><li>Ответы на вопросы о рисунках записывайте ручкой или карандашом в ежедневнике либо на листе бумаги.</li></ol></div><div class="note warning"><strong>Как понимать результат</strong><p>Рисунки не позволяют надёжно определить характер, психическое расстройство, травму или скрытые намерения. Значение детали уточняется по рассказу автора и условиям выполнения. Не используйте отчёт для кадрового отбора, оценки детей, судебных или медицинских решений.</p></div><p class="count">82 признака · 4 чек-листа · вопросы для обсуждения · экспорт протокола. Рисунки не загружаются, отметки хранятся только в открытой странице. Если вы обсуждаете чужие рисунки, сначала получите добровольное согласие автора.</p><label class="check"><input type="checkbox" id="ready"><span>Все три рисунка выполнены. Я готов(а) перейти к наблюдениям.</span></label><button id="begin" class="primary wide" disabled>Открыть чек-листы →</button>');$("ready").checked=state.max>0;$("begin").disabled=!$("ready").checked;$("ready").onchange=()=>$("begin").disabled=!$("ready").checked;$("begin").onclick=advance}
function checklist(i){const g=D.groups[i];shell('<h1>'+esc(g.title)+'</h1><p>'+esc(g.intro)+'</p><div class="row"><span class="pill" id="groupCount"></span><button id="clear">Сбросить раздел</button></div><p class="count">Да — признак непосредственно наблюдается; Нет — вы уверены, что он не соответствует рисунку; Неясно — не можете оценить. Для взаимоисключающих признаков новая отметка «Да» сбрасывает прежнюю «Да» в «Неясно». Неясные признаки не интерпретируются.</p><div class="row noprint"><label for="filter">Показать</label><select id="filter"><option value="all">Все признаки</option><option value="unknown">Неясные</option><option value="yes">Отмеченные «Да»</option><option value="no">Отмеченные «Нет»</option></select></div><div class="preview-tools noprint"><button id="showPrimary" class="primary wide">Открыть первичную интерпретацию всех рисунков</button><details open id="liveDetails"><summary>Первичная интерпретация текущего рисунка</summary><div id="livePrimary" aria-live="polite"></div></details></div><div id="checks">'+g.items.map((v,j)=>'<fieldset class="tri" data-row="'+j+'"><legend>'+esc(v[1])+'</legend><div class="tri-options">'+[["yes","Да"],["no","Нет"],["unknown","Неясно"]].map(([k,label])=>'<label><input type="radio" name="item'+j+'" data-item="'+j+'" value="'+k+'" '+(getStatus(state,i,v[0])===k?'checked':'')+'><span>'+label+'</span></label>').join("")+'</div></fieldset>').join("")+'</div><details><summary>Вопросы к автору рисунка</summary><p>Запишите ответы на бумаге. Не подсказывайте интерпретацию.</p><ol>'+D.questions[i].map(q=>'<li>'+esc(q)+'</li>').join("")+'</ol></details><div class="row"><button id="prev">← Назад</button><button class="primary" id="next">'+(i===3?'Сформировать отчёт':'Следующий раздел')+' →</button></div>');const sync=()=>{const v=stats(state,i);$("groupCount").textContent="Да: "+v.yes+" · Нет: "+v.no+" · Неясно: "+v.unknown;app.querySelector(".count").textContent=checked(state)+" / "+D.groups.reduce((n,g)=>n+g.items.length,0)+" уточнено";$("livePrimary").innerHTML=primaryHTML(state,i);const filter=$("filter").value;$("checks").querySelectorAll("input").forEach(b=>b.checked=getStatus(state,i,g.items[+b.dataset.item][0])===b.value);$("checks").querySelectorAll("[data-row]").forEach(el=>el.hidden=filter!=="all"&&getStatus(state,i,g.items[+el.dataset.row][0])!==filter)};$("checks").querySelectorAll("input").forEach(b=>b.onchange=()=>{if(b.checked){setStatus(state,i,g.items[+b.dataset.item][0],b.value);sync()}});$("filter").onchange=sync;$("showPrimary").onclick=openPrimary;$("clear").onclick=()=>{if(confirm("Сбросить ответы в этом разделе?")){state.selected[i]=[];state.absent[i]=[];sync()}};$("prev").onclick=()=>navigate(state.step-1);$("next").onclick=advance;sync()}
function reportText(s){const r=report(s);return ["YUGATNEO — Дом, дерево, человек 2.1","Протокол наблюдений, не психологическое заключение.","Дата: "+new Date().toLocaleDateString("ru-RU"),"Уточнено: "+checked(s)+" из "+D.groups.reduce((n,g)=>n+g.items.length,0),primaryText(s), "", "ПОДРОБНЫЙ ПРОТОКОЛ",...r.flatMap(g=>["","== "+g.title+" ==","Да: "+g.items.length+"; Нет: "+g.absent.length+"; Неясно: "+g.unknown.length,"Тема: "+g.theme,...g.items.flatMap(v=>["Наблюдение: "+v[1],"Вопрос: "+v[3],"Альтернативное объяснение: "+v[4]]),"Нет:",...g.absent.map(v=>"- "+v[1]),"Неясно:",...g.unknown.map(v=>"- "+v[1]),"Вопросы к автору:",...g.questions.map(q=>"- "+q)]),"","Повторяющиеся темы для обсуждения:",...topics(s).map(([t,g])=>t+": "+g.join(", ")),"","Итог на бумаге: наблюдение; значение по словам автора; альтернативное объяснение; открытый вопрос. Не делайте клинических выводов по деталям."].join("\n")}
function output(){const r=report(state),total=D.groups.reduce((n,g)=>n+g.items.length,0),n=checked(state),t=topics(state);shell('<h1>Протокол наблюдений</h1><div id="primaryReport">'+primaryHTML(state)+'</div><div class="grid metrics"><div class="tile"><strong>'+count(state)+'</strong><small>Да</small></div><div class="tile"><strong>'+(n-count(state))+'</strong><small>Нет</small></div><div class="tile"><strong>'+(total-n)+'</strong><small>Неясно</small></div></div><p>Уточнено '+n+' из '+total+' пунктов. Это полнота заполнения, а не психологический балл.</p><div class="note"><strong>Принцип интерпретации</strong><p>Отмеченные «Да» признаки сопровождаются открытыми вопросами и возможными непсихологическими объяснениями. Значение уточняется по словам автора. «Нет» и «Неясно» не превращаются в психологические выводы.</p></div>'+r.map((g,i)=>'<details open><summary>'+esc(g.title)+' · '+g.items.length+' / '+(g.items.length+g.absent.length+g.unknown.length)+' «Да»</summary><p>Темы для обсуждения: '+esc(g.theme)+'</p>'+(g.items.length?g.items.map(v=>'<div class="report-item"><strong>'+esc(v[1])+'</strong><p><b>Вопрос:</b> '+esc(v[3])+'</p><p><small><b>Альтернативное объяснение:</b> '+esc(v[4])+'</small></p></div>').join(""):'<p>Нет отмеченных «Да» признаков.</p>')+'<details><summary>Ответы «Нет» ('+g.absent.length+') и «Неясно» ('+g.unknown.length+')</summary><p><b>Нет:</b> '+(g.absent.map(v=>esc(v[1])).join("; ")||"—")+'</p><p><b>Неясно:</b> '+(g.unknown.map(v=>esc(v[1])).join("; ")||"—")+'</p></details><h3>Вопросы к автору</h3><ol>'+g.questions.map(q=>'<li>'+esc(q)+'</li>').join("")+'</ol><button class="wide noprint" data-edit="'+i+'">Редактировать чек-лист</button></details>').join("")+'<div class="note"><strong>Повторяющиеся темы для обсуждения</strong><p>Это общие категории наблюдений в нескольких рисунках, а не совпадение психологических признаков.</p>'+(t.length?'<ul>'+t.map(([k,g])=>'<li>'+esc(k)+': '+esc(g.join(", "))+'</li>').join("")+'</ul>':'<p>Общие категории по отмеченным признакам не выделены.</p>')+'</div><div class="note"><strong>Итоговая письменная рефлексия</strong><ol><li>Что действительно изображено?</li><li>Как сам автор объясняет значение деталей?</li><li>Какие другие объяснения возможны?</li><li>Какой вопрос хочется исследовать дальше?</li></ol></div><div class="row"><button id="txt">Сохранить TXT</button><button id="print">Печать / PDF</button></div><div class="row" style="margin-top:8px"><button id="restart">Новая сессия</button><button id="copy">Копировать протокол</button></div><p class="status" id="notice" role="status"></p><details><summary>Ограничения метода</summary><p>Данный чек-лист — авторская адаптация для наблюдения и обсуждения, а не стандартизированный бланк HTP. Нельзя устанавливать диагноз, характер, скрытые намерения или травму по рисунку.</p><p><a href="https://pubmed.ncbi.nlm.nih.gov/?term=house+tree+person+drawing+validity" target="_blank" rel="noopener">Поиск научных публикаций по валидности HTP в PubMed</a></p></details>');app.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>navigate(+b.dataset.edit+1));$("txt").onclick=()=>{try{const u=URL.createObjectURL(new Blob([reportText(state)],{type:"text/plain;charset=utf-8"}));const a=document.createElement("a");a.href=u;a.download="house-tree-person-report-v2.1.txt";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000)}catch{$("notice").textContent="Не удалось создать файл. Используйте печать или копирование."}};$("print").onclick=()=>{app.querySelectorAll("details").forEach(d=>d.open=true);window.print()};$("copy").onclick=async()=>{try{await navigator.clipboard.writeText(reportText(state));$("notice").textContent="Протокол скопирован."}catch{$("notice").textContent="Буфер обмена недоступен. Используйте TXT."}};$("restart").onclick=()=>{if(confirm("Начать новую сессию? Отметки будут сброшены.")){state=fresh();render()}}}
$("closePrimary").onclick=()=>{const d=$("primaryDialog");if(typeof d.close==="function")d.close();else d.removeAttribute("open")};
function render(){if(state.step===0)intro();else if(state.step===5)output();else checklist(state.step-1)}
render();
