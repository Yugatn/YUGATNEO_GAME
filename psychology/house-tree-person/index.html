лизации и умения рисовать."],["noFace","Черты лица не обозначены или не видны","Ракурс и детализация","Куда обращён человек? Почему лицо изображено так?","Фигура может быть повернута спиной или нарисована схематично."],["hands","Кисти рук изображены","Действия","Что человек делает руками? Чем он занят?","Кисти могут быть видны по выбранной позе."],["noHands","Кисти рук не видны или не прорисованы","Действия и ракурс","Где находятся руки персонажа? Какова его поза?","Руки могут быть в карманах, за спиной или вне кадра."],["feet","Стопы или обувь видны","Положение в пространстве","На чём стоит человек? Куда он направляется?","Видимость стоп зависит от кадрирования и одежды."],["noFeet","Стопы не видны или не прорисованы","Положение в пространстве","Где находятся ноги? Как выбран ракурс?","Фигура может быть портретной, сидящей или частично скрытой."],["clothes","Одежда имеет заметные детали","Контекст","Как человек одет и в какой ситуации находится?","Одежда может отражать вымышленную роль, сезон или эстетику."],["motion","Фигура изображена в движении","Действия","Что человек делает сейчас и что будет делать дальше?","Движение может быть частью выбранного сюжета."],["still","Фигура стоит или сидит неподвижно","Действия","Что происходит вокруг человека? Почему он находится в этой позе?","Статичная поза проще для рисования или соответствует портрету."],["objects","У человека есть предметы, аксессуары или инструменты","Занятия","Зачем персонажу эти предметы? Как он их использует?","Предметы могут обозначать профессию, хобби или сюжет."],["company","На листе есть другие люди или объекты","Окружение","Кто или что находится рядом? Как они связаны с персонажем?","Дополнительные элементы могут просто уточнять историю."]]},{"title":"Общие наблюдения","theme":"Техника, условия и контекст","intro":"Отметьте особенности процесса только если они известны. Не отмечайте то, что вы не наблюдали.","items":[["erasures","Заметны исправления или следы стирания","Процесс","Что автор решил const $=id=>document.getElementById(id),app=$("app"),names=["Инструкция","Дом","Дерево","Человек","Общие признаки","Отчёт"];

function fresh(){return {step:0,max:0,selected:D.groups.map(()=>[]),reviewed:D.groups.map(()=>false)}}
let state=fresh();
function toggle(s,g,id,on){if(!D.groups[g]?.items.some(x=>x[0]===id))return false;let a=s.selected[g];if(on){for(const pair of D.conflicts[g])if(pair.includes(id))a=a.filter(k=>!pair.includes(k));if(!a.includes(id))a.push(id)}else a=a.filter(k=>k!==id);s.selected[g]=a;return true}
function report(s){return D.groups.map((g,i)=>({title:g.title,theme:g.theme,reviewed:s.reviewed[i],items:g.items.filter(v=>s.selected[i].includes(v[0])),questions:D.questions[i]}))}

function navigate(n){if(n<0||n>5||n>state.max)return;state.step=n;render();if(typeof window.scrollTo==="function")window.scrollTo(0,0)}

function shell(content){app.innerHTML='<section class="panel"><div class="row"><span class="tag">Этап '+(state.step+1)+' / 6</span><span class="count">'+count(state)+' отмечено</span></div><div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="6" aria-valuenow="'+(state.step+1)+'"><i style="width:'+((state.step+1)/6*100)+'%"></i></div><nav class="steps noprint" aria-label="Этапы">'+names.map((n,i)=>'<button data-step="'+i+'" '+(i>state.max?'disabled':'')+(i===state.step?' aria-current="step"':'')+'>'+n+'</button>').join("")+'</nav>'+content+'</section>';app.querySelectorAll("[data-step]").forEach(b=>b.onclick=()=>navigate(+b.dataset.step))}
const icons=['<path d="M4 24 28 5 52 24M11 22v29h34V22M23 51V34h10v17M15 28h7v7h-7M36 28h7v7h-7"/>','<path d="M28 51V28M28 39l-11-9M28 32l11-9M11 51h34"/><path d="M16 31C2 30 3 15 15 13 17 1 37 1 41 14 54 15 55 34 40 35"/>','<circle cx="28" cy="10" r="7"/><path d="M28 17v19M10 27l18-6 18 6M28 36 16 51M28 36l12 15"/>'];
function intro(){shell('<h1>Дом, дерево, человек</h1><p>Цифровой протокол наблюдения и обсуждения рисунков по мотивам проективной методики HTP Джона Бака. Это не стандартизированная диагностика.</p><div class="grid">'+["Дом","Дерево","Человек"].map((n,i)=>'<div class="tile"><svg viewBox="0 0 56 56" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">'+icons[i]+'</svg>'+n+'</div>').join("")+'</div><div class="note"><h3>Инструкция к рисованию</h3><ol><li>Подготовьте три чистых листа бумаги одинакового формата, простой карандаш и ластик.</li><li>На первом листе нарисуйте дом, на втором — дерево, на третьем — человека целиком. Рисуйте так, как вам удобно. Художественные способности не оцениваются.</li><li>Не используйте образцы и не изучайте признаки заранее. Не ограничивайте себя искусственно по времени.</li><li>После завершения всех рисунков откройте чек-листы и отмечайте только непосредственно наблюдаемые признаки.</li><li>Ответы на вопросы о рисунках записывайте ручкой или карандашом в ежедневнике либо на листе бумаги.</li></ol></div><div class="note warning"><strong>Как понимать результат</strong><p>Рисунки не позволяют надёжно определить характер, психическое расстройство, травму или скрытые намерения. Значение детали уточняется по рассказу автора и условиям выполнения. Не используйте отчёт для кадрового отбора, оценки детей, судебных или медицинских решений.</p></div><p class="count">52 признака · 4 чек-листа · вопросы для обсуждения · экспорт протокола. Рисунки не загружаются, отметки хранятся только в открытой странице.</p><label class="check"><input type="checkbox" id="ready"><span>Все три рисунка выполнены. Я готов(а) перейти к наблюдениям.</span></label><button id="begin" class="primary wide" disabled>Открыть чек-листы →</button>');$("ready").checked=state.max>0;$("begin").disabled=!$("ready").checked;$("ready").onchange=()=>$("begin").disabled=!$("ready").checked;$("begin").onclick=advance}
function checklist(i){let g=D.groups[i];shell('<h1>'+esc(g.title)+'</h1><p>'+esc(g.intro)+'</p><div class="row"><span class="pill" id="groupCount">'+state.selected[i].length+' / '+g.items.length+' отмечено</span><button id="clear">Снять отметки</button></div><p class="count">Если признак неясен или неизвестен — оставьте его неотмеченным. Пустая отметка не означает отсутствие признака. Взаимоисключающие варианты заменяют друг друга.</p><div id="checks">'+g.items.map((v,j)=>'<label class="check"><input type="checkbox" data-item="'+j+'" '+(state.selected[i].includes(v[0])?'checked':'')+'><span>'+esc(v[1])+'</span></label>').join("")+'</div><details><summary>Вопросы к автору рисунка</summary><p>Запишите ответы на бумаге после завершения рисунков. Не подсказывайте интерпретацию.</p><ol>'+D.questions[i].map(q=>'<li>'+esc(q)+'</li>').join("")+'</ol></details><div class="row"><button id="prev">← Назад</button><button class="primary" id="next">'+(i===3?'Сформировать отчёт':'Следующий раздел')+' →</button></div>');const sync=()=>{$("groupCount").textContent=state.selected[i].length+" / "+g.items.length+" отмечено";app.querySelector(".count").textContent=count(state)+" отмечено";$("checks").querySelectorAll("input").forEach(b=>b.checked=state.selected[i].includes(g.items[+b.dataset.item][0]))};$("checks").querySelectorAll("input").forEach(b=>b.onchange=()=>{toggle(state,i,g.items[+b.dataset.item][0],b.checked);sync()});$("clear").onclick=()=>{state.selected[i]=[];sync()};$("prev").onclick=()=>navigate(state.step-1);$("next").onclick=advance}
function reportText(s){const r=report(s);return ["YUGATNEO — Дом, дерево, человек","Протокол наблюдений и вопросов, не психологическое заключение.","Дата: "+new Date().toLocaleDateString("ru-RU"),"Отмечено признаков: "+count(s),...r.flatMap(g=>["","== "+g.title+" ==","Тема для обсуждения: "+g.theme,...(!g.items.length?["Признаки не отмечены. Это не означает их отсутствие."]:g.items.flatMap(v=>["Наблюдение: "+v[1],"Вопрос: "+v[3],"Альтернативное объяснение: "+v[4]])),"Вопросы к автору:",...g.questions.map(q=>"- "+q)]),"","Вывод формулирует автор рисунков по своим ответам. Не делайте клинических выводов по отдельным деталям."].join("\n")}
function output(){const r=report(state);shell('<h1>Протокол наблюдений</h1><p>Отмечено '+count(state)+' признаков. Это число выбранных пунктов, а не психологический балл.</p><div class="note"><strong>Принцип интерпретации</strong><p>В каждом разделе показаны наблюдение, открытый вопрос и возможное непсихологическое объяснение. Сопоставляйте их с рассказом автора, а не с предполагаемыми чертами личности.</p></div>'+r.map((g,i)=>'<details open><summary>'+esc(g.title)+' · '+g.items.length+' отмечено</summary><p><strong>Темы для обсуждения:</strong> '+esc(g.theme)+'</p>'+(g.items.length?g.items.map(v=>'<div class="report-item"><strong>'+esc(v[1])+'</strong><p><b>Вопрос:</b> '+esc(v[3])+'</p><p><small><b>Другие объяснения:</b> '+esc(v[4])+'</small></p></div>').join(""):'<p>Ни один пункт не отмечен. Это не доказывает отсутствие признаков.</p>')+'<h3>Дополнительные вопросы</h3><ol>'+g.questions.map(q=>'<li>'+esc(q)+'</li>').join("")+'</ol><button class="wide noprint" data-edit="'+i+'">Редактировать чек-лист</button></details>').join("")+'<div class="note"><strong>Итоговая рефлексия</strong><p>Запишите от руки: какие значения автор сам придаёт деталям, что его удивило, какие вопросы остались открыты и что он хотел бы обсудить дальше.</p></div><div class="row"><button id="txt">Сохранить TXT</button><button id="print">Печать / PDF</button></div><div class="row" style="margin-top:8px"><button id="restart">Новая сессия</button><button id="copy">Копировать протокол</button></div><p class="status" id="notice" role="status"></p><details><summary>Научные ограничения и источники</summary><p>Обзоры HTP описывают неоднородность критериев и недостаточную стандартизацию. Исследования не дают основания использовать данный авторский чек-лист как инструмент постановки диагноза.</p><p><a href="https://pubmed.ncbi.nlm.nih.gov/36683989/" target="_blank" rel="noopener">Систематический обзор и метаанализ HTP, 2023</a></p><p><a href="https://pubmed.ncbi.nlm.nih.gov/36058187/" target="_blank" rel="noopener">Исследование ограничений предсказательной валидности, 2022</a></p><p><a href="https://pubmed.ncbi.nlm.nih.gov/40310075/" target="_blank" rel="noopener">Систематический обзор конструктивных проективных методик, 2025</a></p></details>');app.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>navigate(+b.dataset.edit+1));$("txt").onclick=()=>{try{const u=URL.createObjectURL(new Blob([reportText(state)],{type:"text/plain;charset=utf-8"}));const a=document.createElement("a");a.href=u;a.download="house-tree-person-report.txt";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000)}catch{$("notice").textContent="Не удалось создать файл. Используйте печать или копирование."}};$("print").onclick=()=>window.print();$("copy").onclick=async()=>{try{await navigator.clipboard.writeText(reportText(state));$("notice").textContent="Протокол скопирован."}catch{$("notice").textContent="Буфер обмена недоступен. Используйте TXT."}};$("restart").onclick=()=>{if(confirm("Начать новую сессию? Отметки будут сброшены.")){state=fresh();render()}}}
function render(){if(state.step===0)intro();else if(state.step===5)output();else checklist(state.step-1)}
render();
</script></body></html>
