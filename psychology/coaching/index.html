<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101820"><title>YUGATNEO · Коучинг</title><style>
:root{color-scheme:dark;--bg:#101820;--panel:#1c2935;--line:#344653;--text:#edf5f6;--muted:#b3c1ce;--accent:#a7eac2;--warm:#f3d28d}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#263d47,transparent 65%),var(--bg);color:var(--text);font:16px/1.55 system-ui,sans-serif}main{max-width:760px;margin:auto;padding:20px 15px 48px}header{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:12px;letter-spacing:1.5px;color:var(--accent);font-weight:800}a{color:var(--accent)}h1{font-size:clamp(32px,7vw,52px);line-height:1.05;letter-spacing:-1.7px;margin:14px 0}h2{font-size:clamp(21px,4vw,29px);line-height:1.35;margin:14px 0}p{color:var(--muted);margin:10px 0}.panel{padding:clamp(16px,4vw,28px);background:var(--panel);border:1px solid var(--line);border-radius:19px;margin:16px 0}.note{border-left:3px solid var(--accent);padding:4px 14px;margin:18px 0;color:var(--text)}.warning{border-left-color:var(--warm)}.tag{color:var(--accent);font-size:12px;font-weight:750;letter-spacing:1px;text-transform:uppercase}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:9px;margin:16px 0}button,select{font:inherit;border:1px solid var(--line);background:#263746;color:inherit;border-radius:12px;padding:13px;cursor:pointer;min-height:48px}button:hover,button[aria-pressed=true]{border-color:var(--accent);background:#29483e}button:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}button:disabled{opacity:.4;cursor:default}.primary{background:var(--accent);color:#113429;font-weight:800;border-color:var(--accent)}.primary:hover{background:#c4f4d6;color:#113429}.choice{text-align:left;display:flex;flex-direction:column;gap:4px}.choice strong{font-size:17px}.choice small,small{color:var(--muted)}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row button{flex:1}.wide{width:100%}.question{font-size:clamp(23px,5vw,35px);font-weight:650;line-height:1.35;margin:22px 0;letter-spacing:-.4px;overflow-wrap:break-word}.progress{height:7px;border-radius:7px;background:var(--line);overflow:hidden;margin:12px 0}.progress span{display:block;height:100%;background:var(--accent)}.crumb{font-size:13px;color:var(--muted);overflow-wrap:anywhere}.step{display:inline-block;padding:4px 10px;background:#263b46;color:var(--accent);border-radius:8px;font-size:12px}.paper{display:flex;gap:12px;align-items:flex-start;border:1px dashed #658675;padding:13px;border-radius:12px;margin:18px 0}.paper span{font-size:23px}.paper p{margin:0}.switch{display:flex;gap:10px;align-items:flex-start;margin:16px 0}.switch input{width:21px;height:21px;accent-color:var(--accent);flex-shrink:0}label{display:block;margin:8px 0}select{width:100%}footer{font-size:12px;color:var(--muted);text-align:center}ol{padding-left:24px}li{margin:12px 0}details{margin:14px 0}summary{cursor:pointer}#status{min-height:1em}.counter{font-variant-numeric:tabular-nums}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}@media(max-width:450px){header{letter-spacing:.5px}.row button{min-width:110px}}@media print{body{color:#111;background:white}header,footer,button,.noprint{display:none!important}.panel{background:white;color:#111;border:0;padding:0}p,small,.tag,.crumb{color:#333}.paper{border-color:#aaa}main{max-width:none;padding:0}}
</style></head><body><main><header><span>YUGATNEO / COACHING</span><a href="../">Все тесты</a></header><div id="app"></div><footer>Самостоятельная рефлексия · без регистрации · без сбора ответов</footer></main><script>
"use strict";
const D={"topics":[["Цели и мотивация","Понять, чего хочется, и найти направление",[["Не знаю, чего хочу",["Какие три занятия дают мне ощущение смысла, даже если за них никто не хвалит?","Какие желания принадлежат мне, а какие я перенял{g} от окружающих?","Если бы оценка других людей не имела значения, что я хотел{g} бы попробовать?","Какой небольшой эксперимент поможет проверить это желание на практике?"]],["Знаю цель, но не начинаю",["Как выглядит моя цель в наблюдаемых действиях, а не в абстрактных словах?","Что именно происходит в тот момент, когда я откладываю первый шаг?","Как уменьшить первый шаг настолько, чтобы он занял не более десяти минут?","Какие условия помогут мне повторить этот шаг завтра?"]],["Потерял{g} интерес к цели",["Что изменилось с момента, когда эта цель стала важной?","Какую потребность я рассчитывал{g} удовлетворить с её помощью?","Что я сохраняю, если меняю цель, и что действительно теряю?","Как проверить, стоит ли продолжать, изменить путь или отказаться от цели?"]]]],["Отношения и близость","Партнёрство, доверие, общение",[["Трудно говорить о потребностях",["Какую потребность я хочу выразить, не обвиняя другого человека?","Что я опасаюсь услышать в ответ и на чём основано это ожидание?","Как сформулировать конкретную просьбу, оставив другому право отказаться?","Какое время и место подойдут для спокойного разговора?"]],["Конфликт или непонимание",["Что произошло фактически, без догадок о намерениях другого?","Какие чувства и потребности стоят за моей реакцией?","Какая другая интерпретация ситуации возможна?","Какое предложение учитывает границы обеих сторон?"]],["Расставание или одиночество",["Что именно мне сейчас не хватает: контакта, привычного уклада, поддержки или чего-то ещё?","Какие стороны своей жизни я хочу восстановить независимо от отношений?","С кем я могу безопасно и добровольно поддерживать контакт?","Какой бережный шаг поможет вернуть устойчивость сегодня?"]]]],["Самооценка и уверенность","Самокритика, собственная ценность",[["Сравниваю себя с другими",["С кем и по каким критериям я сравниваю себя?","Какие различия в условиях, опыте и ресурсах остаются за рамками сравнения?","Какими своими поступками я могу гордиться?","Какой личный критерий прогресса я выберу вместо чужого результата?"]],["Боюсь ошибиться",["Какую конкретную ошибку я предвижу?","Что из предполагаемых последствий реально, а что является прогнозом?","Как я поддержал{g} бы близкого человека в такой ситуации?","Как провести небольшой обратимый эксперимент с допустимым риском?"]],["Завишу от чужого одобрения",["Чьё одобрение я ищу и почему оно так важно?","Что я считаю ценным в себе независимо от оценок?","В какой ситуации я могу выразить своё мнение уважительно, не добиваясь согласия?","Как я пойму, что действую в соответствии со своими ценностями?"]]]],["Работа и развитие","Профессия, обучение, рабочие условия",[["Хочу сменить направление",["Какие задачи в текущей деятельности дают мне энергию, а какие истощают?","Какие навыки я могу перенести в другую сферу?","Что нужно выяснить о новой сфере до серьёзных обязательств?","Какой эксперимент даст мне реальные данные о новой профессии?"]],["Не расту профессионально",["Какой конкретный навык сейчас ограничивает мой рост?","Какие факты подтверждают этот вывод?","Как организовать практику с обратной связью без чрезмерной нагрузки?","Какой результат через месяц будет свидетельствовать о моём прогрессе?"]],["Не устраивают условия труда",["Какие условия нарушают мои потребности или договорённости?","Что находится в моей зоне влияния, а что требует решения работодателя?","Какие варианты переговоров, поддержки или поиска другой работы доступны?","Какой безопасный шаг сохранит мои интересы и ресурсы?"]]]],["Эмоции и стресс","Распознать переживания и выбрать поддержку",[["Перегружен{adj}",["Какие задачи и обстоятельства сейчас создают наибольшую нагрузку?","Что я замечаю в теле и поведении, когда нагрузка растёт?","Что можно отложить, делегировать или упростить без существенного ущерба?","Какая форма отдыха или поддержки доступна мне сегодня?"]],["Раздражение или обида",["Что произошло непосредственно перед моей реакцией?","Какую границу или потребность затронула ситуация?","Что я могу сделать, не причиняя вреда себе и окружающим?","Как выразить свою позицию, когда эмоциональное напряжение уменьшится?"]],["Тревожусь о будущем",["Какой конкретный сценарий меня беспокоит?","Какие факты его подтверждают и какие не подтверждают?","Что я могу подготовить, а что сейчас не могу контролировать?","Какой небольшой шаг поможет вернуться к текущим делам?"]]]],["Решения и выбор","Разобраться в альтернативных вариантах",[["Выбираю между вариантами",["Какие варианты существуют, включая возможность пока ничего не менять?","Какие три критерия выбора для меня важнее всего?","Какие преимущества, издержки и неопределённости есть у каждого варианта?","Как получить недостающую информацию до принятия решения?"]],["Боюсь пожалеть о выборе",["Какое сожаление я предвижу и чего стараюсь избежать?","Какие решения обратимы, а какие требуют особой осторожности?","Какой запасной план уменьшит возможные последствия?","Как принять решение с учётом доступной информации, а не требования полной определённости?"]],["Чувствую давление окружающих",["Какие ожидания других влияют на мой выбор?","Какие из них совпадают с моими ценностями, а какие нет?","Какие реальные ограничения необходимо уважать, даже если мне не нравится их наличие?","Как выразить своё решение без агрессии и с уважением к чужим границам?"]]]],["Привычки и дисциплина","Изменение повседневного поведения",[["Хочу сформировать привычку",["Какое конкретное поведение я хочу повторять?","Какой существующий ежедневный сигнал напомнит мне о нём?","Какую минимальную версию действия я смогу выполнять даже в трудный день?","Как буду отмечать выполнение на бумаге без самонаказания за пропуски?"]],["Хочу сократить нежелательную привычку",["В каких ситуациях чаще возникает это действие?","Какую потребность оно помогает удовлетворять?","Какая безопасная альтернатива может удовлетворить ту же потребность?","Как изменить окружение, чтобы облегчить выбор альтернативы?"]],["Постоянно откладываю",["Какую задачу я откладываю и какая её часть вызывает затруднение?","Чего не хватает: ясности, навыка, энергии или ресурсов?","Как разделить задачу на короткие конкретные действия?","Когда и где я сделаю первое действие?"]]]],["Личные границы","Уважение к себе и другим",[["Трудно отказывать",["На какие просьбы мне особенно трудно отвечать отказом?","Каких последствий я ожидаю, если скажу «нет»?","Как сформулировать отказ кратко, спокойно и без унижения другого?","В какой безопасной ситуации я могу потренироваться?"]],["Мои границы не уважают",["Какое конкретное поведение нарушает мои границы?","Как я могу обозначить границу и действие, которое предприму сам{self}, если её снова нарушат?","Какие люди или службы могут поддержать меня при необходимости?","Как защитить себя, не увеличивая риск для своей безопасности?"]],["Слишком много беру на себя",["За какие задачи я отвечаю по договорённости, а какие принял{g} добровольно?","Какие обязательства уже превышают мои ресурсы?","О чём можно договориться заново, учитывая интересы всех участников?","Какую задачу я могу вернуть ответственному за неё человеку?"]]]],["Смысл и ценности","Выстроить жизнь вокруг важного",[["Не чувствую смысла",["В какие моменты я ощущаю связь с чем-то важным для меня?","Какие люди, дела или принципы я хотел{g} бы сохранить в своей жизни?","Какой маленький поступок может воплотить одну из этих ценностей сегодня?","К кому я могу обратиться за поддержкой, если чувство бессмысленности сохраняется?"]],["Мои ценности противоречат друг другу",["Какие две ценности сейчас вступили в конфликт?","В чём ценность каждой из них для меня?","Есть ли вариант, позволяющий уважать обе хотя бы частично?","Какой компромисс я готов{adj} принять и почему?"]],["Хочу изменить образ жизни",["Какие составляющие моей нынешней жизни я хочу сохранить?","Что я хотел{g} бы изменить в первую очередь и почему?","Какие ресурсы и ограничения необходимо учитывать?","Как проверить изменение в течение недели, не принимая поспешных необратимых решений?"]]]],["Свой запрос","Если ни одна готовая тема не подходит",[["Разобраться в ситуации",["Как сформулировать мой запрос одним предложением?","Какие факты, чувства и предположения важно разделить?","Что я уже делал{g} и к чему это привело?","Какая информация могла бы изменить моё понимание ситуации?"]],["Найти решение",["Что будет конкретным признаком решения моего запроса?","Какие варианты, включая обращение за поддержкой, я вижу?","Какие ограничения и последствия нужно учесть?","Какой вариант можно проверить небольшим обратимым шагом?"]],["Определить следующий шаг",["Какую часть запроса я могу решить самостоятельно?","Что зависит от других людей или обстоятельств?","Какое действие максимально конкретно, безопасно и выполнимо?","Когда я сделаю его и как оценю результат?"]]]]],"barriers":[["Не хватает ясности",["Какой вопрос остаётся без ответа?","Где я могу получить надёжную информацию или обратную связь?","Какие данные будут достаточными, чтобы сделать следующий шаг?"]],["Не хватает ресурсов",["Какого ресурса мне не хватает: времени, сил, знаний, денег или поддержки?","Что можно уменьшить, отложить или изменить с учётом реальных ограничений?","Кого можно попросить о помощи и как сформулировать конкретную просьбу?"]],["Мешают страх или сомнения",["Какого исхода я опасаюсь и насколько мои опасения подтверждены фактами?","Какой безопасный и обратимый эксперимент уменьшит неопределённость?","Как я поддержу себя, если эксперимент не даст желаемого результата?"]],["Мешают внешние обстоятельства",["Что находится вне моего контроля?","Какие права, границы и обязательства важно учесть?","Какое действие в моей зоне влияния доступно сейчас?"]],["Готов{adj} действовать",["Какое решение я готов{adj} проверить на практике?","Что может помешать и какой запасной вариант я предусмотрю?","Как я пойму, что пора продолжать, корректировать или остановиться?"]]],"common":["Чего я хочу добиться в результате этой сессии? Как я узнаю, что она оказалась полезной?","Что происходит сейчас? Какие факты я могу отделить от собственных интерпретаций?"],"action":["Запишите одно конкретное действие на ближайшие 24 часа. Где и когда я его выполню?","Какой минимальный шаг я могу сделать, если обстоятельства изменятся?","По каким наблюдаемым признакам через неделю я оценю результат?","Что я понял{g} о себе в ходе этой сессии? Как я могу отнестись к себе с уважением, даже если результат окажется неидеальным?"],"roles":["Как ожидания, связанные с моей гендерной ролью, влияют на этот запрос? Какие из них я действительно разделяю?","Что бы я выбрал{g}, если бы мне не требовалось соответствовать чужим представлениям о гендере? Как сохранить уважение к себе и другим?"]};
const app=document.getElementById("app"),$=id=>document.getElementById(id);
const grammar={m:{g:"",adj:"",self:"",refl:""},f:{g:"а",adj:"а",self:"а",refl:"а"},n:{g:"(а)",adj:"(а)",self:"(а)",refl:"(ась)"}};
// Use explicit full forms where adding a suffix is not grammatically correct.
function form(t,g){if(g==="n"){t=t.replace("доволен{adj}","могу гордиться").replace("продвинулся{refl}","достигнуть прогресса удалось").replace("сам{self}","лично").replace("Готов{adj}","Есть готовность").replace("Перегружен{adj}","Чувствую перегрузку").replace("готов{adj}","готов(а)")}else if(g==="f"){t=t.replace("доволен{adj}","довольна").replace("продвинулся{refl}","продвинулась")}else{t=t.replace("продвинулся{refl}","продвинулся")};return t.replace(/\{(g|adj|self|refl)\}/g,(_,k)=>grammar[g][k])}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const stages=["Настройка","Запрос","Уточнение","Исследование","Препятствие","Следующий шаг","Итог"];
function build(t,b,g,role,k=null){const first=[...D.common,...D.topics[t][2][b][1],...(role?D.roles:[])];return {first:first.map(q=>form(q,g)),last:k===null?[]:[...D.barriers[k][1],...D.action].map(q=>form(q,g))}}
function initial(){return {stage:0,g:"n",role:false,t:null,b:null,k:null,pos:0,visited:[]}}
let s=initial(),stack=[];
function snapshot(){return JSON.parse(JSON.stringify(s))}
function move(fn){stack.push(snapshot());fn();render()}
function back(){if(stack.length){s=stack.pop();render()}}
function reset(){if(s.stage===0||confirm("Начать новую сессию? Записанные на бумаге ответы останутся у вас.")){s=initial();stack=[];render()}}
function controls(){return '<div class="row noprint" style="margin-top:18px">'+(stack.length?'<button id="back">← Назад</button>':'')+'<button id="reset">Начать заново</button></div>'}
function bindControls(){if($("back"))$("back").onclick=back;if($("reset"))$("reset").onclick=reset}
function shell(content){app.innerHTML='<section class="panel"><div class="row"><span class="step">Этап '+(s.stage+1)+' из 7</span><span class="tag">'+stages[s.stage]+'</span></div><div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="7" aria-valuenow="'+(s.stage+1)+'"><span style="width:'+((s.stage+1)/7*100)+'%"></span></div>'+content+controls()+'</section>';bindControls()}
function choices(arr,fn){$("choices").innerHTML=arr.map((item,i)=>'<button class="choice" data-i="'+i+'"><strong>'+esc(item[0])+'</strong>'+(item[1]?'<small>'+esc(item[1])+'</small>':'')+'</button>').join("");$("choices").querySelectorAll("button").forEach(b=>b.onclick=()=>fn(+b.dataset.i))}
function trail(){return s.t===null?"":'<p class="crumb">'+esc(D.topics[s.t][0])+(s.b===null?"":" → "+esc(form(D.topics[s.t][2][s.b][0],s.g)))+'</p>'}
function question(list,offset,next){const i=s.pos,q=list[i],num=offset+i+1;const total=build(s.t,s.b,s.g,s.role,0).first.length+7;shell(trail()+'<div class="tag counter">Вопрос '+num+' из '+total+'</div><div class="question" id="question" tabindex="-1">'+esc(q)+'</div><div class="paper"><span aria-hidden="true">✎</span><p><strong>Запишите ответ на бумаге.</strong><br>Поставьте номер '+num+' в ежедневнике. Не торопитесь. Можно пропустить вопрос, если он не подходит.</p></div><div class="row"><button id="skip">Пропустить</button><button class="primary" id="written">Ответ записан →</button></div>');function proceed(done){move(()=>{s.visited=s.visited.filter(v=>v.num!==num);s.visited.push({num,q,done});if(i+1<list.length)s.pos++;else{s.pos=0;s.stage=next}})}$("skip").onclick=()=>proceed(false);$("written").onclick=()=>proceed(true);$("question").focus()}
function render(){switch(s.stage){
case 0:shell('<h1>Диалог с собой</h1><p>Интерактивная коучинговая сессия, которая подстраивает последовательность вопросов под ваш запрос и выбранное направление.</p><div class="note"><strong>Инструкция</strong><p style="color:inherit">Возьмите ежедневник или лист бумаги, ручку или карандаш. Ответы на все вопросы записывайте от руки в ежедневнике или на листе бумаги. Не вводите личные ответы в приложение. Записывайте номер вопроса, отвечайте своими словами, выделите 20–40 минут в спокойном месте.</p></div><label for="gender">Выберите удобную форму обращения</label><select id="gender"><option value="n">Нейтральная / не указывать гендер</option><option value="m">Мужчина — мужской род</option><option value="f">Женщина — женский род</option></select><label class="switch"><input type="checkbox" id="role"><span>Добавить вопросы о влиянии гендерных ожиданий на мой запрос (необязательно).</span></label><small>Гендер используется для грамматических форм и выбранной темы социальных ожиданий, а не для предположений о характере, способностях или жизненных ролях.</small><div class="note warning"><small>Это инструмент саморефлексии, не психотерапия и не диагностика. Если ситуация связана с насилием, непосредственной опасностью или кризисом, прежде всего обратитесь к безопасному человеку, местным экстренным службам или специалисту. Вы можете прекратить сессию в любой момент.</small></div><button id="start" class="primary wide">Выбрать запрос →</button>');$("gender").value=s.g;$("role").checked=s.role;$("gender").onchange=e=>s.g=e.target.value;$("role").onchange=e=>s.role=e.target.checked;$("start").onclick=()=>move(()=>s.stage=1);break;
case 1:shell('<h2>С каким запросом вы хотите поработать?</h2><p>Выберите ближайшую тему. Свой запрос можно сформулировать на бумаге.</p><div class="grid" id="choices"></div>');choices(D.topics.map(t=>[t[0],t[1]]),i=>move(()=>{s.t=i;s.b=null;s.stage=2}));break;
case 2:shell(trail()+'<h2>Что точнее описывает вашу ситуацию?</h2><p>От этого выбора зависит следующая серия вопросов.</p><div class="grid" id="choices"></div>');choices(D.topics[s.t][2].map(b=>[form(b[0],s.g)]),i=>move(()=>{s.b=i;s.pos=0;s.stage=3}));break;
case 3:question(build(s.t,s.b,s.g,s.role).first,0,4);break;
case 4:shell(trail()+'<h2>Что сейчас больше всего мешает двигаться дальше?</h2><p>Просмотрите записи. Выберите препятствие, которое стало яснее после ответов, или готовность действовать.</p><div class="grid" id="choices"></div>');choices(D.barriers.map(b=>[form(b[0],s.g)]),i=>move(()=>{s.k=i;s.pos=0;s.stage=5}));break;
case 5:{const b=build(s.t,s.b,s.g,s.role,s.k);question(b.last,b.first.length,6);break}
case 6:{const count=s.visited.filter(v=>v.done).length;const total=s.visited.length;shell(trail()+'<div class="tag">Сессия завершена</div><h1>Мой следующий шаг</h1><p>Записано ответов: <strong>'+count+' из '+total+'</strong>. Пропущено: '+(total-count)+'. Это не оценка вашей личности и не балл.</p><div class="note"><strong>Перечитайте свои записи</strong><p style="color:inherit">Подчеркните важную мысль, обведите одно действие и поставьте в ежедневнике дату проверки результата. Если ответ не найден, допустимо вернуться к запросу позже или обсудить его со специалистом.</p></div><details open><summary>Маршрут и список вопросов</summary><ol>'+[...s.visited].sort((a,b)=>a.num-b.num).map(v=>'<li>'+esc(v.q)+' <small>— '+(v.done?'записан':'пропущен')+'</small></li>').join("")+'</ol></details><div class="row noprint"><button id="print">Распечатать вопросы</button><button id="download">Сохранить список</button></div><p><small>Экспорт содержит только выбранные вопросы и отметки прохождения. Рукописные ответы остаются у вас.</small></p>');$("print").onclick=()=>window.print();$("download").onclick=()=>{const t=["YUGATNEO — Диалог с собой",D.topics[s.t][0],form(D.topics[s.t][2][s.b][0],s.g),...s.visited.map(v=>v.num+". "+v.q+" ["+(v.done?"записан":"пропущен")+"]")].join("\n");const url=URL.createObjectURL(new Blob([t],{type:"text/plain;charset=utf-8"}));const a=document.createElement("a");a.href=url;a.download="coaching-questions.txt";document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)};break}
}}
render();
</script></body></html>
