op{animation:pop .4s ease-out}@keyframes pop{from{transform:scale(.97);opacity:.3}to{transform:scale(1);opacity:1}}@media(prefers-reduced-motion:reduce){*{animation:none!important}} </style></head><body><main><header><div class="row"><a href="../">← Психология</a><small>YUGATNEO · v0.4</small></div><h1>Путь жизни</h1><div class="row"><span id="xp"></span><span id="count"></span></div><progress id="progress" max="44" value="0" aria-label="Освоенные задания"></progress><nav aria-label="Режимы"><button id="quest">Квест</button><button id="brain">Интеллект</button><button id="models">Модели</button><button id="planner">Семья</button></nav><div class="map" id="map" aria-label="Карта возрастов"></div></header><div id="screen"></div><footer>Образовательная игра, не диагностика и не индивидуальная медицинская рекомендация. Возрастные границы условны, кризисы не обязательны, развитие пластично. Прогресс хранится только в браузере. <button id="reset">Сбросить прогресс</button></footer></main><script>
"use strict";const D=[["До рождения","Будущие родители","Подготовка и поддержка","Партнёр тревожится перед рождением ребёнка.","Выслушать, обсудить поддержку и подготовку вместе","Сказать, что тревога недопустима","Оставить всё на потом",0,"Совместная подготовка и поддержка помогают справляться с неопределённостью.","Вы заметили потребность в поддержке.","Как Вы думаете, что укрепит команду родителей?","Обсудить обязанности и отдых заранее","Считать, что другой сам догадается","Скрывать усталость",0,"Договорённости уменьшают неопределённость."],["0–1 год","Младенчество","Доверие и безопасность (Эриксон)","Младенец плачет и ищет контакта.","Игнорировать, чтобы не привыкал","Проверить потребности, спокойно откликнуться","Стыдить за плач",1,"Чуткий отклик способствует безопасности; хроническая непредсказуемость может затруднять её формирование.","Вы откликнулись на сигнал ребёнка.","Как Вы думаете, что помогает ребёнку узнавать мир?","Безусловное молчание","Обмен взглядами, звуками и жестами","Требование говорить раньше срока",1,"Взаимный контакт поддерживает обучение."],["1–3 года","Раннее детство","Автономия и сомнение (Эриксон)","Ребёнок хочет самостоятельно надеть ботинки.","Сделать всё вместо него","Назвать его неумелым","Дать время и предложить помощь",2,"Посильный выбор поддерживает автономию. Постоянное унижение может усиливать сомнение в себе.","Вы сохранили пространство для самостоятельности.","Как Вы думаете, что лучше развивает настойчивость?","Посильная задача и поддержка усилий","Сравнение с другими","Требование мгновенного результата",0,"Поддержка усилий оставляет место для проб и ошибок."],["3–6 лет","Дошкольный возраст","Инициатива и вина (Эриксон)","Ребёнок строит необычный дом из кубиков, но он падает.","Спросить, как можно перестроить дом","Сказать, что он всё делает неправильно","Запретить экспериментировать",0,"Игра и исследование дают возможность пробовать идеи. Частые упрёки могут сдерживать инициативу.","Вы поддержали эксперимент!","Как Вы думаете, что может произойти вместо упрёка, если задать вопрос о новой конструкции?","Ребёнок гарантированно станет гением","Ребёнок может предложить новый способ и проявить творчество","Творчество больше не потребует практики",1,"Любопытный вопрос может поддержать исследование, но не гарантирует талант."],["6–12 лет","Школьный возраст","Компетентность и неполноценность (Эриксон)","У школьника не получается задача по математике.","Сравнить с отличником","Спросить, какой способ он уже пробовал, и помочь найти следующий","Выполнить за него все задания",1,"Конкретная обратная связь и посильная помощь поддерживают освоение навыка; ярлыки могут мешать уверенности.","Вы заметили усилия, а не только результат.","Как Вы думаете, какая фраза поддержит мышление?","Ты обязан быть лучшим","У тебя нет способностей","Что изменится, если попробовать рисунок или другой способ?",2,"Поиск альтернатив тренирует гибкость; результат зависит также от обучения и условий."],["12–18 лет","Подростковый возраст","Идентичность и неопределённость ролей (Эриксон)","Подросток выбирает увлечение, которое семье незнакомо.","Запретить без разговора","Навязать собственную профессию","Обсудить интересы, риски и границы безопасности",2,"Исследование ролей может поддерживать идентичность; давление иногда затрудняет самостоятельный выбор.","Вы уважили право подростка искать себя.","Как Вы думаете, какой вопрос поможет ему?","Что тебе интересно в этом занятии и как попробовать безопасно?","Почему ты не такой, как все?","Когда ты перестанешь спорить?",0,"Вопрос помогает сформулировать собственные мотивы."],["18–30 лет","Ранняя взрослость","Близость и изоляция (Эриксон)","Молодой взрослый хочет изменить карьеру и просит совета.","Обсудить варианты, ценности и ресурсы, оставив выбор ему","Выбрать за него","Обесценить сомнения",0,"Поддержка автономии и отношений помогает исследовать выбор. Возраст не обязывает иметь семью или карьеру.","Вы предложили поддержку без контроля.","Как Вы думаете, что помогает принять решение?","Запрет на сомнения","Маленький обратимый эксперимент","Сравнение с чужим успехом",1,"Пробный шаг позволяет проверить ожидания."],["30–65 лет","Средняя взрослость","Вклад и застой (Эриксон)","Взрослый совмещает работу, детей и заботу о близких, сильно устал.","Увеличить обязанности","Разделить нагрузку и запланировать отдых","Скрывать усталость",1,"Вклад в развитие других возможен в разных формах; хроническая перегрузка мешает благополучию.","Вы учли ресурсы самого заботящегося.","Как Вы думаете, что делает заботу устойчивой?","Отказ от всех личных потребностей","Одиночное преодоление любой нагрузки","Распределение обязанностей и своевременная помощь",2,"Забота о себе помогает сохранять способность поддерживать других."],["65+ лет","Поздняя взрослость","Целостность и отчаяние (Эриксон)","Пожилой отец медленно пользуется телефоном и просит помочь.","Отобрать телефон и сделать всё молча","Посмеяться над ошибкой","Спросить, чего он хочет, и терпеливо показать шаги",2,"Уважение автономии и адаптация темпа поддерживают участие. Старение неоднородно.","Вы сохранили достоинство и самостоятельность близкого.","Как Вы думаете, какой вопрос лучше задать?","Хотите попробовать сами или показать ещё раз?","Зачем Вам вообще телефон?","Почему Вы ничего не помните?",0,"Выбор и терпение помогают участию; новые выраженные нарушения памяти требуют медицинской оценки."],["6–12 мес. · вкус","Первое знакомство с едой","Пищевое научение · первый прикорм","Представьте: ребёнок ещё не ходит и не говорит. Ему около шести месяцев, он готов к прикорму. Вы выбираете, какие вкусы станут частью его мира. Что предложить в дополнение к грудному молоку или смеси?","Чипсы или солёную закуску, потому что мне вкусно","Мягкие овощи, подходящую по текстуре кашу (например, гречневую) и постепенно разнообразные продукты, включая источники железа","Только любимую взрослым еду, независимо от состава и текстуры",1,"Полезная еда тоже может быть вкусной. Разнообразный прикорм примерно с шести месяцев при готовности ребёнка знакомит с вкусами и помогает обеспечить питательные вещества. Взрослые выбирают безопасные продукты, но ребёнок не обязан доедать.","Отличный выбор! Вы подумали о потребностях ребёнка, а не только о собственных привычках.","Как Вы думаете, если полезные продукты регулярно появляются на столе в спокойной обстановке, что может произойти?","Один удачный обед навсегда определит предпочтения","Ребёнок обязательно будет любить всё предложенное","Знакомые вкусы могут стать более привлекательными, а семейные приёмы пищи — приятными воспоминаниями",2,"Повторное знакомство повышает вероятность принятия некоторых продуктов, особенно овощей. Приятные семейные ассоциации возможны, но не гарантированы и не определяют всё дальнейшее развитие."],["6–24 мес. · пробы","Не понравилось с первого раза","Повторное знакомство · отзывчивое кормление","Малыш отворачивается от брокколи. Как поступить?","Спокойно завершить пробу и предложить снова в другой день без давления","Настоять на полной порции","Навсегда исключить брокколи и давать только знакомую пищу",0,"Отказ при первой пробе не равен устойчивой нелюбви. Обзоры исследований показывают, что неоднократное знакомство с овощами может улучшить их принятие; важно уважать сигналы сытости и отказа.","Вы проявили терпение и уважили сигналы малыша.","Как Вы думаете, что ребёнок узнаёт, когда взрослый спокойно принимает его отказ?","Что нужно есть ради одобрения","Что можно исследовать новые вкусы без угрозы и давления","Что любая еда опасна",1,"Спокойная атмосфера помогает сохранять готовность к знакомству с пищей. Не нужно превращать количество съеденного в соревнование."],["1–3 года · пример","Семейный стол","Наблюдение и подражание","Ребёнок видит, что родители регулярно едят чипсы, а ему предлагают овощи. Как создать более последовательный пример?","Требовать овощи, продолжая демонстрировать противоположную привычку","Запретить ребёнку смотреть, что едят взрослые","Чаще самим есть разнообразные продукты вместе с ребёнком и предлагать ему подходящие по возрасту блюда",2,"Семейное окружение и наблюдение за взрослыми могут влиять на пищевое научение. Не нужна идеальная семья: небольшие устойчивые изменения полезнее стыда и жёстких запретов.","Вы выбрали обучение личным примером.","Как Вы думаете, почему привычный семейный борщ может стать любимым блюдом взрослого человека?","Вкус, запах, обстановка и семейные традиции могут связываться с приятным опытом","Кислый вкус неизбежно формирует вредную привычку","Все дети наследуют конкретные любимые блюда родителей",0,"Ассоциации с семейной едой возможны. Борщ, каши и другие блюда могут быть частью разнообразного рациона, если состав и текстура соответствуют возрасту; кислый вкус или специи сами по себе не делают пищу вредной."],["3–6 лет · эмоции","Еда и тёплые воспоминания","Эмоциональные ассоциации · самостоятельность","Ребёнок расстроился после неудачи. Вы хотите его поддержать. Как действовать?","Каждый раз покупать сладость, чтобы он перестал плакать","Выслушать, помочь назвать чувства, предложить объятие или игру; кормить по потребности, а не как награду за эмоции","Сказать, что он не заслуживает ужина",1,"Утешение и питание не обязательно связывать. Если еда постоянно становится единственным способом справляться с переживаниями, может формироваться привычка обращаться к ней за утешением. Это риск, а не неизбежность.","Вы помогли ребёнку пережить эмоции, сохранив уважение к его потребностям.","Как Вы думаете, какой семейный ритуал поможет связать полезную еду с приятным опытом?","Хвалить только за пустую тарелку","Запрещать вставать, пока всё не съедено","Вместе приготовить простое блюдо, поговорить за столом и разрешить остановиться при сытости",2,"Совместное приготовление, выбор посильных задач и спокойное общение создают возможности для положительного опыта. Не существует обязательного блюда или гарантии конкретной привычки на всю жизнь."],["0–2 · внимание","Первый экран — лицо родителя","Когнитивная безопасность · живое общение","Представьте: младенец тянется к Вам, а на смартфоне появляется сообщение. Что Вы сделаете?","Продолжу листать ленту: ребёнок ещё не понимает","Включу ролик, чтобы отвлечь его","Отложу телефон, откликнусь на ребёнка; если дело срочное, использую устройство кратко и возвращусь к контакту",2,"Живой обмен взглядами, звуками и жестами поддерживает развитие. ВОЗ не рекомендует малоподвижный экранный досуг до двух лет; это не запрет необходимой связи или видеозвонков с близкими.","Вы сохранили возможность живого взаимодействия!","Как Вы думаете, чему ребёнок может научиться, наблюдая за привычками взрослых?","Что экран всегда важнее разговора","Что цифровым инструментом можно пользоваться целенаправленно и вовремя отложить его","Что взрослые никогда не должны использовать технику",1,"Личный пример и последовательность правил могут поддерживать освоение привычек. Нет возраста, после которого постоянное отвлечение взрослого становится безвредным."],["2–5 · первый экран","Смартфон попросил малыш","Совместное использование · выбор контента","Трёхлетний ребёнок просит Ваш смартфон. Какую цифровую среду Вы готовы ему предложить?","Открытую ленту коротких роликов с автопроигрыванием","Заранее выбранную спокойную возрастную игру без рекламы, покупок и чата; ненадолго вместе со взрослым","Неограниченный доступ ко всем приложениям",1,"В раннем возрасте приоритет — движение, сон, общение, предметная игра. ВОЗ рекомендует в 2–4 года не более часа малоподвижного экранного времени в день, меньше лучше. Это потолок, не ежедневная норма. Можно выбрать и совсем без экрана.","Вы продумали не только время, но и содержание!","Как Вы думаете, что полезнее сделать после совместной игры на сортировку форм?","Найти такие же формы среди настоящих предметов и обсудить их","Немедленно запустить бесконечную ленту","Считать, что одна игра уже измерила интеллект ребёнка",0,"Связь экранной задачи с реальными предметами и разговором создаёт дополнительные возможности обучения. Игровой результат не  победы?","Какую конструкцию ты придумал и где такой способ можно применить вне игры?",2,"Рефлексия помогает назвать стратегию и попробовать её в другой ситуации. Можно вместе построить модель из кубиков или нарисовать план."],["9–12 · кооперация","Играем вместе","Коммуникация · саморегуляция","Двое детей спорят в совместной игре. Как превратить это в тренировку гибких навыков?","Предложить договориться о ролях, сделать паузу и обсудить план; выбирать локальную кооперативную игру с возрастной маркировкой","Объявить проигравшего неспособным","Потребовать продолжать до победы, даже если пора спать",0,"Кооперативная игра создаёт ситуацию для переговоров и распределения задач, но навыки не появляются автоматически. Пример: совместные головоломки или подходящие по маркировке уровни Overcooked! 2. Гонки Mario Kart могут упражнять управление и реакцию в конкретной задаче.","Вы превратили конфликт в возможность сотрудничества.","Как Вы думаете, какой результат важнее для обучения?","Победа любой ценой","Умение договориться, объяснить стратегию и остановиться вовремя","Число часов без перерыва",1,"Наблюдаемые навыки важнее количества очков. Сон, движение и общение сохраняют приоритет."],["10–14 · смартфон","Первый личный телефон","Цифровая готовность · приватность","Ребёнок просит собственный смартфон. Что проверить до покупки?","Возраст одноклассников: если у них есть, больше ничего не важно","Готовность соблюдать правила и сообщать о проблемах, реальную потребность в связи; рассмотреть простой телефон и настроить семейные ограничения","Разрешить любые приложения и покупки, чтобы не ограничивать самостоятельность",1,"AAP в рекомендациях 2026 года не называет единого возраста готовности к смартфону. Важны зрелость, безопасность, совместные договорённости и постепенная самостоятельность. Ограничьте незнакомые контакты, покупки, рекламу и уведомления; обсуждайте приватность.","Вы связали свободу с подготовленностью, а не с модой.","Как Вы думаете, что лучше установить в первую очередь?","Бесконечные ленты и открытый чат с незнакомцами","Приложения, запрашивающие ненужные контакты, геолокацию и фотографии","Средства связи, библиотеку, инструменты творчества, выбранные головоломки и настройки приватности",2,"Устройство может быть инструментом связи, чтения, творчества и обучения. Проверяйте разрешения, возрастные рейтинги и возможность выключить рекламу, покупки и открытые чаты."],["12–18 · алгоритмы","Управляю вниманием","Медиаграмотность · критическое мышление","Подросток хочет играть онлайн и создавать собственные проекты. Как помочь ему пользоваться цифровой средой осознанно?","Запретить любое творчество на компьютере","Обсудить приватность, возрастные ограничения, безопасность общения и перерывы; выбрать проект с понятной целью","Оставить алгоритмам и незнакомцам полный контроль над его вниманием",1,"Самостоятельность можно расширять постепенно. Стратегии, программирование, конструкторы и монтаж дают возможности практики. Roblox требует особенно тщательного выбора конкретного проекта и проверки чатов, покупок и пользовательского контента; маркировка и настройки не гарантируют безопасность.","Вы поддержали творчество и безопасность одновременно.","Как Вы думаете, как распознать игру, которая отвлекает от собственной цели?","Она постоянно подталкивает к покупкам, бесконечным сессиям или возвращению ради награды, даже когда я хочу остановиться","Она имеет понятный момент завершения","Она позволяет отключить уведомления и играть без покупок",0,"Это признаки, которые стоит оценивать, а не диагноз зависимости. Можно выключить уведомления, выбрать игру без навязчивых механик и заранее определить время остановки."]],L=[["Скорость обработки","Быстрое выполнение простых операций","Часто высока в молодости; с возрастом может снижаться."],["Рабочая память","Удержание и преобразование информации","Развивается в детстве и юности; возрастные траектории зависят от задачи."],["Текучий интеллект","Решение новых задач и выявление закономерностей","Развивается в детстве, многие показатели достигают высоких значений в ранней взрослости."],["Кристаллизованный интеллект","Словарь, знания и накопленный опыт","Может расти в зрелости и сохраняться в старшем возрасте."],["Исполнительные функции","Планирование, торможение, переключение","Развиваются в детстве и подростковом возрасте, изменяются в течение жизни."],["Творческое и социальное мышление","Генерация идей, понимание контекста и людей","Не имеют единого возраста пика; зависят от опыта, задачи и среды."]],K="yugatneo.lifeQuest.v1",ORDER=[0,1,13,9,10,2,11,14,3,12,15,4,16,17,18,5,19,6,7,8],TOTAL=D.length*2;

function evaluatePlan(m,choices){const checks=m[3].map((f,i)=>({answered:Number.isInteger(choices[i])&&choices[i]>=0&&choices[i]<f[1].length,ok:f[2].includes(choices[i]),reason:f[3]}));return {checks,complete:checks.every(c=>c.answered),passed:checks.every(c=>c.ok),count:checks.filter(c=>c.ok).length}}
function validKey(k){return typeof k==="string"&&(/^(?:[0-9]|1[0-9]):[01]$/.test(k)||/^m:[0-3]$/.test(k))}
function grant(done,key){if(done.includes(key))return false;done.push(key);return true}
function xp(done){return done.reduce((sum,k)=>sum+(k.startsWith("m:")?100:50),0)}
