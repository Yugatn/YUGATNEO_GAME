splay:none}.mode-menu nav{position:absolute;top:100%;left:0;right:0;padding:10px;border-radius:12px;background:#17263a;border:1px solid #47627e;box-shadow:0 10px 30px #0008;z-index:4}.spatial-grid{display:grid;gap:3px;width:min(100%,104px);aspect-ratio:1;flex-shrink:0}.spatial-grid span{aspect-ratio:1;border:1px solid #47627e;border-radius:2px}.spatial-grid .filled{background:#8bdac5}.spatial-grid .empty{background:#17263a}.spatial-source{display:grid;place-items:center;padding:12px}.spatial-options{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.spatial-options button{display:grid;justify-items:center;gap:7px;padding:8px 4px;font-size:12px}.spatial-options .spatial-grid{width:100%;max-width:90px}.map{display:flex;position:relative;overflow:auto;gap:6px;padding:6px 0}.map[hidden]{display:none}.map button{min-width:80px;font-size:13px;padding:6px}.map button[aria-current=true]{border-color:#8bdac5;background:#235e6b}.good{border-color:#6ed9b3;background:#183c3c}.hint{border-color:#e2b06a}.choices button{text-align:left}.reward{font-size:32px;color:#ffdc9a}.row{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}details{margin-top:14px}summary{cursor:pointer;color:#a9d5ff}label{display:block;margin:12px 0}select{width:100%}footer{font-size:13px;margin:20px 0}.pop{animation:pop .4s ease-out}@keyframes pop{from{transform:scale(.97);opacity:.3}to{transform:scale(1);opacity:1}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}.pref-toggle{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid #47627e;border-radius:12px}.pref-toggle input{width:24px;height:24px;accent-color:#8bdac5;flex-shrink:0}textarea,input[type=file]{width:100%;max-width:100%;font:inherit;color:inherit}textarea{background:#101a2a;border:1px solid #47627e;border-radius:10px;padding:10px;resize:vertical}textarea:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid #ffd38c;outline-offset:2px}.pref-large{font-size:21px}.pref-large h1{font-size:32px}.pref-large h2{font-size:25px}.pref-large nav button,.pref-large .map button,.pref-large .spatial-options button{font-size:17px}.pref-large small,.pref-large footer{font-size:16px}.pref-large button,.pref-large select{min-height:54px}.pref-large header{position:static}.pref-contrast{background:#000;color:#fff}.pref-contrast header,.pref-contrast section,.pref-contrast article,.pref-contrast .mode-menu nav,.pref-contrast textarea{background:#090909;border-color:#fff}.pref-contrast button,.pref-contrast select,.pref-contrast .mode-menu summary{background:#171717;border-color:#fff;color:#fff}.pref-contrast .tag,.pref-contrast .muted,.pref-contrast small,.pref-contrast a,.pref-contrast summary,.pref-contrast .story-line span{color:#fff}.pref-contrast .good,.pref-contrast button.good,.pref-contrast button[aria-current=true]{background:#123c29;border:2px solid #a7ffb8}.pref-contrast .hint,.pref-contrast button.hint{border:2px solid #ffcb83}.pref-contrast .spatial-grid .filled{background:#fff}.pref-contrast .spatial-grid .empty{background:#000;border-color:#aaa}.pref-calm *{animation:none!important;transition:none!important;scroll-behavior:auto!important}@media(max-width:420px){.pref-large .mission-tabs{grid-template-columns:1fr}.pref-large section,.pref-large article{padding:12px}.pref-large .mode-menu nav{grid-template-columns:1fr;position:static}}.resume-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0 16px}.resume-row p{flex:1 1 210px;margin:0;font-size:.9em}.resume-row button{flex:0 1 auto}.mission-tabs{grid-template-columns:repeat(2,minmax(0,1fr))}button,select{overflow-wrap:anywhere;min-width:0}html{scroll-padding-top:205px}@media(max-width:380px){main{padding-left:10px;padding-right:10px}section,article{padding:12px}.resume-row button{width:100%}.mode-menu nav{max-height:45vh;overflow:auto}}.mode-menu nav{max-height:55vh;overflow-y:auto} </style></head><body><main><header><div class="row"><a href="../">← Психология</a><small>YUGATNEO · v0.14</small></div><h1>Тренажер Югатна</h1><div class="row"><span id="xp"></span><span id="count"></span></div><progress id="progress" max="90" value="0" aria-label="Освоенные задания"></progress><details id="modeMenu" class="mode-menu"><summary><span id="modeLabel">Квест</span><span>Разделы ▾</span></summary><nav aria-label="Режимы"><button id="quest">Квест</button><button id="brain">Интеллект</button><button id="models">Модели</button><button id="planner">Семья</button><button id="story">Истории</button><button id="conflicts">Диалоги</button><button id="perspectives">Роли</button><button id="habits">Привычки</button><button id="thinking">Мышление</button><button id="learning">Мой маршрут</button><button id="settings">Настройки</button></nav></details><div class="map" id="map" aria-label="Карта возрастов"></div></header><div id="screen"></div><footer>Образовательная игра, не диагностика и не индивидуальная медицинская рекомендация. Возрастные границы условны, кризисы не обязательны, развитие пластично. Прогресс хранится в браузере; резервную копию можно скачать в настройках. <button id="reset">Сбросить прогресс</button></footer></main><script>
"use strict";const D=[["До рождения","Будущие родители","Подготовка и поддержка","Партнёр тревожится перед рождением ребёнка.","Выслушать, обсудить поддержку и подготовку вместе","Сказать, что тревога недопустима","Оставить всё на потом",0,"Совместная подготовка и поддержка помогают справляться с неопределённостью.","Вы заметили потребность в поддержке.","Как Вы думаете, что укрепит команду родителей?","Обсудить обязанности и отдых заранее","Считать, что другой сам догадается","Скрывать усталость",0,"Договорённости уменьшают неопределённость."],["0–1 год","Младенчество","Доверие и безопасность (Эриксон)","Младенец плачет и ищет контакта.","Игнорировать, чтобы не привыкал","Проверить потребности, спокойно откликнуться","Стыдить за плач",1,"Чуткий отклик способствует безопасности; хроническая непредсказуемость может затруднять её формирование.","Вы откликнулись на сигнал ребёнка.","Как Вы думаете, что помогает ребёнку узнавать мир?","Безусловное молчание","Обмен взглядами, звуками и жестами","Требование говорить раньше срока",1,"Взаимный контакт поддерживает обучение."],["1–3 года","Раннее детство","Автономия и сомнение (Эриксон)","Ребёнок хочет самостоятельно надеть ботинки.","Сделать всё вместо него","Назвать его неумелым","Дать время и предложить помощь",2,"Посильный выбор поддерживает автономию. Постоянное унижение может усиливать сомнение в себе.","Вы сохранили пространство для самостоятельности.","Как Вы думаете, что лучше развивает настойчивость?","Посильная задача и поддержка усилий","Сравнение с другими","Требование мгновенного результата",0,"Поддержка усилий оставляет место для проб и ошибок."],["3–6 лет","Дошкольный возраст","Инициатива и вина (Эриксон)","Ребёнок строит необычный дом из кубиков, но он падает.","Спросить, как можно перестроить дом","Сказать, что он всё делает неправильно","Запретить экспериментировать",0,"Игра и исследование дают возможность пробовать идеи. Частые упрёки могут сдерживать инициативу.","Вы поддержали эксперимент!","Как Вы думаете, что может произойти вместо упрёка, если задать вопрос о новой конструкции?","Ребёнок гарантированно станет гением","Ребёнок может предложить новый способ и проявить творчество","Творчество больше не потребует практики",1,"Любопытный вопрос может поддержать исследование, но не гарантирует талант."],["6–12 лет","Школьный возраст","Компетентность и неполноценность (Эриксон)","У школьника не получается задача по математике.","Сравнить с отличником","Спросить, какой способ он уже пробовал, и помочь найти следующий","Выполнить за него все задания",1,"Конкретная обратная связь и посильная помощь поддерживают освоение навыка; ярлыки могут мешать уверенности.","Вы заметили усилия, а не только результат.","Как Вы думаете, какая фраза поддержит мышление?","Ты обязан быть лучшим","У тебя нет способностей","Что изменится, если попробовать рисунок или другой способ?",2,"Поиск альтернатив тренирует гибкость; результат зависит также от обучения и условий."],["12–18 лет","Подростковый возраст","Идентичность и неопределённость ролей (Эриксон)","Подросток выбирает увлечение, которое семье незнакомо.","Запретить без разговора","Навязать собственную профессию","Обсудить интересы, риски и границы безопасности",2,"Исследование ролей может поддерживать идентичность; давление иногда затрудняет самостоятельный выбор.","Вы уважили право подростка искать себя.","Как Вы думаете, какой вопрос поможет ему?","Что тебе интересно в этом занятии и как попробовать безопасно?","Почему ты не такой, как все?","Когда ты перестанешь спорить?",0,"Вопрос помогает сформулировать собственные мотивы."],["18–30 лет","Ранняя взрослость","Близость и изоляция (Эриксон)","Молодой взрослый хочет изменить карьеру и просит совета.","Обсудить варианты, ценности и ресурсы, оставив выбор ему","Выбрать за него","Обесценить сомнения",0,"Поддержка автономии и отношений помогает исследовать выбор. Возраст не обязывает иметь семью или карьеру.","Вы предложили поддержку без контроля.","Как Вы думаете, что помогает принять решение?","Запрет на сомнения","Маленький обратимый эксперимент","Сравнение с чужим успехом",1,"Пробный шаг позволяет проверить ожидания."],["30–65 лет","Средняя взрослость","Вклад и застой (Эриксон)","Взрослый совмещает работу, детей и заботу о близких, сильно устал.","Увеличить обязанности","Разделить нагрузку и запланировать отдых","Скрывать усталость",1,"Вклад в развитие других возможен в разных формах; хроническая перегрузка мешает благополучию.","Вы учли ресурсы самого заботящегося.","Как Вы думаете, что делает заботу устойчивой?","Отказ от всех личных потребностей","Одиночное преодоление любой нагрузки","Распределение обязанностей и своевременная помощь",2,"Забота о себе помогает сохранять способность поддерживать других."],["65+ лет","Поздняя взрослость","Целостность и отчаяние (Эриксон)","Пожилой отец медленно пользуется телефоном и просит помочь.","Отобрать телефон и сделать всё молча","Посмеяться над ошибкой","Спросить, чего он хочет, и терпеливо показать шаги",2,"Уважение автономии и адаптация темпа поддерживают участие. Старение неоднородно.","Вы сохранили достоинство и самостоятельность близкого.","Как Вы думаете, какой вопрос лучше задать?","Хотите попробовать сами или показать ещё раз?","Зачем Вам вообще телефон?","Почему Вы ничего не помните?",0,"Выбор и терпение помогают участию; новые выраженные нарушения памяти требуют медицинской оценки."],["6–12 мес. · вкус","Первое знакомство с едой","Пищевое научение · первый прикорм","Представьте: ребёнок ещё не ходит и не говорит. Ему около шести месяцев, он готов к прикорму. Вы выбираете, какие вкусы станут частью его мира. Что предложить в дополнение к грудному молоку или смеси?","Чипсы или солёную закуску, потому что мне вкусно","Мягкие овощи, подходящую по текстуре кашу (например, гречневую) и постепенно разнообразные продукты, включая источники железа","Только любимую взрослым еду, независимо от состава и текстуры",1,"Полезная еда тоже может быть вкусной. Разнообразный прикорм примерно с шести месяцев при готовности ребёнка знакомит с вкусами и помогает обеспечить питательные вещества. Взрослые выбирают безопасные продукты, но ребёнок не обязан доедать.","Отличный выбор! Вы подумали о потребностях ребёнка, а не только о собственных привычках.","Как Вы думаете, если полезные продукты регулярно появляются на столе в спокойной обстановке, что может произойти?","Один удачный обед навсегда определит предпочтения","Ребёнок обязательно будет любить всё предложенное","Знакомые вкусы могут стать более привлекательными, а семейные приёмы пищи — приятными воспоминаниями",2,"Повторное знакомство повышает вероятность принятия некоторых продуктов, особенно овощей. Приятные семейные ассоциации возможны, но не гарантированы и не определяют всё дальнейшее развитие."],["6–24 мес. · пробы","Не понравилось с первого раза","Повторное знакомство · отзывчивое кормление","Малыш отворачивается от брокколи. Как поступить?","Спокойно завершить пробу и предложить снова в другой день без давления","Настоять на полной порции","Навсегда исключить брокколи и давать только знакомую пищу",0,"Отказ при первой пробе не равен устойчивой нелюбви. Обзоры исследований показывают, что неоднократное знакомство с овощами может улучшить их принятие; важно уважать сигналы сытости и отказа.","Вы проявили терпение и уважили сигналы малыша.","Как Вы думаете, что ребёнок узнаёт, когда взрослый спокойно принимает его отказ?","Что нужно есть ради одобрения","Что можно исследовать новые вкусы без угрозы и давления","Что любая еда опасна",1,"Спокойная атмосфера помогает сохранять готовность к знакомству с пищей. Не нужно превращать количество съеденного в соревнование."],["1–3 года · пример","Семейный стол","Наблюдение и подражание","Ребёнок видит, что родители регулярно едят чипсы, а ему предлагают овощи. Как создать более последовательный пример?","Требовать овощи, продолжая демонстрировать противоположную привычку","Запретить ребёнку смотреть, что едят взрослые","Чаще самим есть разнообразные продукты вместе с ребёнком и предлагать ему подходящие по возрасту блюда",2,"Семейное окружение и наблюдение за взрослыми могут влиять на пищевое научение. Не нужна идеальная семья: небольшие устойчивые изменения полезнее стыда и жёстких запретов.","Вы выбрали обучение личным примером.","Как Вы думаете, почему привычный семейный борщ может стать любимым блюдом взрослого человека?","Вкус, запах, обстановка и семейные традиции могут связываться с приятным опытом","Кислый вкус неизбежно формирует вредную привычку","Все дети наследуют конкретные любимые блюда родителей",0,"Ассоциации с семейной едой возможны. Борщ, каши и другие блюда могут быть частью разнообразного рациона, если состав и текстура соответствуют возрасту; кислый вкус или специи сами по себе не делают пищу вредной."],["3–6 лет · эмоции","Еда и тёплые воспоминания","Эмоциональные ассоциации · самостоятельность","Ребёнок расстроился после неудачи. Вы хотите его поддержать. Как действовать?","Каждый раз покупать сладость, чтобы он перестал плакать","Выслушать, помочь назвать чувства, предложить объятие или игру; кормить по потребности, а не как награду за эмоции","Сказать, что он не заслуживает ужина",1,"Утешение и питание не обязательно связывать. Если еда постоянно становится единственным способом справляться с переживаниями, может формироваться привычка обращаться к ней за утешением. Это риск, а не неизбежность.","Вы помогли ребёнку пережить эмоции, сохранив уважение к его потребностям.","Как Вы думаете, какой семейный ритуал поможет связать полезную еду с приятным опытом?","Хвалить только за пустую тарелку","Запрещать вставать, пока всё не съедено","Вместе приготовить простое блюдо, поговорить за столом и разрешить остановиться при сытости",2,"Совместное приготовление, выбор посильных задач и спокойное общение создают возможности для положительного опыта. Не существует обязательного блюда или гарантии конкретной привычки на всю жизнь."],["0–2 · внимание","Первый экран — лицо родителя","Когнитивная безопасность · живое общ  очередь?","Бесконечные ленты и открытый чат с незнакомцами","Приложения, запрашивающие ненужные контакты, геолокацию и фотографии","Средства связи, библиотеку, инструменты творчества, выбранные головоломки и настройки приватности",2,"Устройство может быть инструментом связи, чтения, творчества и обучения. Проверяйте разрешения, возрастные рейтинги и возможность выключить рекламу, покупки и открытые чаты."],["12–18 · алгоритмы","Управляю вниманием","Медиаграмотность · критическое мышление","Подросток хочет играть онлайн и создавать собственные проекты. Как помочь ему пользоваться цифровой средой осознанно?","Запретить любое творчество на компьютере","Обсудить приватность, возрастные ограничения, безопасность общения и перерывы; выбрать проект с понятной целью","Оставить алгоритмам и незнакомцам полный контроль над его вниманием",1,"Самостоятельность можно расширять постепенно. Стратегии, программирование, конструкторы и монтаж дают возможности практики. Roblox требует особенно тщательного выбора конкретного проекта и проверки чатов, покупок и пользовательского контента; маркировка и настройки не гарантируют безопасность.","Вы поддержали творчество и безопасность одновременно.","Как Вы думаете, как распознать игру, которая отвлекает от собственной цели?","Она постоянно подталкивает к покупкам, бесконечным сессиям или возвращению ради награды, даже когда я хочу остановиться","Она имеет понятный момент завершения","Она позволяет отключить уведомления и играть без покупок",0,"Это признаки, которые стоит оценивать, а не диагноз зависимости. Можно выключить уведомления, выбрать игру без навязчивых механик и заранее определить время остановки."],["≈1 год · переход","Кризис первого года","Выготский: новые возможности действия и общения","Малыш начинает самостоятельно перемещаться, тянется к предметам и протестует, когда Вы его останавливаете. Как поступить?","Запретить любое исследование","Организовать безопасное пространство, предложить разрешённую альтернативу и спокойно const STORIES=[{"title":"Любознательность","ages":["3 года","7 лет","12 лет"],"scene":"Ребёнок строит башню, она падает. Он смотрит на Вас и ждёт реакции.","first":[["Спросить: «Как сделать основание устойчивее?»","Вы поддержали пробу и поиск стратегии. В повторяющихся ситуациях это может помогать инициативе.",1],["Упрекнуть: «Ты опять всё испортил»","Если упрёки повторяются, ребёнок может начать избегать новых задач. Одна фраза не определяет судьбу.",0]],"later":["В школе ребёнок охотно показывает неудачную модель и пробует другой способ.","В школе ребёнок опасается показывать незавершённую работу. Это лишь один возможный сценарий."],"second":[["Спросить, что он уже пробовал, помочь разобрать ошибку; если раньше упрекали — признать это и извиниться.","Поддержка стратегии и восстановление контакта создают новую возможность учиться.",1],["Сделать за него и потребовать только правильных ответов.","Так можно сократить возможности самостоятельной практики.",0]],"future":["В подростковом возрасте у ребёнка есть опыт поиска решений и обращения за помощью, хотя новые трудности всё равно возможны.","Подростку могут понадобиться дополнительные безопасные возможности для самостоятельных проб."],"question":"Как Вы думаете, что лучше поддержит творческую инициативу?","answers":["Гарантировать успех, решая задачи за ребёнка","Замечать усилия, предлагать новые способы и позволять исправлять ошибки","Хвалить только за первое место"],"correct":1,"explain":"Конкретная обратная связь и возможность практики полезнее ярлыков. Творчество зависит и от других факторов.","action":"На этой неделе попробуйте заменить один упрёк вопросом: «Что можно сделать по-другому?»"},{"title":"Вкус детства","ages":["8 месяцев","4 года","18 лет"],"scene":"Малыш готов к разнообразному прикорму. Как Вы организуете знакомство с продуктами?","first":[["Предлагать безопасные по текстуре разнообразные блюда без давления, уважая отказ.","Повторные спокойные пробы могут улучшать принятие некоторых продуктов.",1],
