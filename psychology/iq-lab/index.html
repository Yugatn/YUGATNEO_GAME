const BANK=[[0,"2, 6, 12, 20, 30, ?","42|40|36|44",0,"Разности: 4, 6, 8, 10, 12."],[0,"81, 27, 9, 3, ?","0|1|2|1,5",1,"Каждый член делится на 3."],[0,"3, 5, 9, 17, 33, ?","49|64|65|66",2,"Каждый член удваивается, затем вычитается 1."],[0,"1, 4, 10, 19, 31, ?","43|45|47|46",3,"Разности растут на 3: 3, 6, 9, 12, 15."],[0,"2, 10, 4, 20, 8, 40, ?","16|12|60|80",0,"Две чередующиеся последовательности удваиваются."],[0,"1, 2, 6, 24, 120, ?","600|720|240|840",1,"Последовательно умножаем на 2, 3, 4, 5, 6."],[0,"7, 10, 16, 28, 52, ?","76|90|100|104",2,"Разности удваиваются: 3, 6, 12, 24, 48."],[0,"Если 4 станка делают 4 детали за 4 минуты, за сколько минут 12 таких станков сделают 12 деталей?","1|3|12|4",3,"Каждый станок делает одну деталь за 4 минуты."],[1,"Все ЛИМЫ — РОКИ. Ни один РОК не является ТАМОМ. Что обязательно верно?","Ни один ЛИМ не является ТАМОМ|Все ТАМЫ — ЛИМЫ|Некоторые ЛИМЫ — ТАМЫ|Все РОКИ — ЛИМЫ",0,"Множество ЛИМОВ входит в РОКИ, которые не пересекаются с ТАМАМИ."],[1,"Аня выше Бориса, Борис выше Веры, Глеб ниже Веры. Кто самый высокий?","Борис|Аня|Вера|Глеб",1,"Аня выше Бориса, а через него — выше Веры и Глеба."],[1,"Если лампа горит, выключатель включён. Выключатель включён. Что можно заключить о лампе?","Она горит|Она не горит|Недостаточно данных|Лампы нет",2,"Из достаточного следствия нельзя вывести исходное условие."],[1,"В коробке 3 красных, 4 синих и 5 зелёных шаров. Сколько нужно достать вслепую, чтобы гарантировать два одного цвета?","2|3|5|4",3,"При трёх шарах возможны три цвета. Четвёртый повторит один из них."],[1,"Ровно один из двух говорит правду. А говорит: «Б лжёт». Б говорит: «Мы оба лжём». Кто говорит правду?","А|Б|Оба|Никто",0,"Утверждение Б не может быть истинным; тогда утверждение А истинно."],[1,"У каждого из пяти участников есть рукопожатие с каждым другим ровно один раз. Сколько рукопожатий?","20|10|15|5",1,"Число неупорядоченных пар: 5 × 4 / 2 = 10."],[1,"Ровно один ключ открывает дверь. Ключ А не подходит. Ключ Б подходит тогда и только тогда, когда подходит В. Какой ключ подходит, если ключей А, Б, В, Г всего четыре?","А|Б|Г|В",2,"Б и В должны подходить вместе или не подходить вместе. Ровно один подходит, значит остаётся Г."],[1,"На карточках А, К, 4, 7 с одной стороны буква, с другой цифра. Нужно проверить правило: если гласная, то чётное число. Какие карточки необходимо перевернуть?","А и 4|К и 7|А и К|А и 7",3,"Нужно проверить гласную и нечётное число: они могут опровергнуть правило."],[2,"Стрелка поворачивается на 90° по часовой стрелке. Продолжите ряд: ↑ → ↓ ?","←|↑|→|↓",0,"Следующее направление — влево."],[2,"Какая фигура завершает матрицу?","<svg viewBox='0 0 60 50' role='img' aria-label='Контурный круг'><circle cx='30' cy='25' r='14' fill='none' stroke='currentColor' stroke-width='3'/></svg>|<svg viewBox='0 0 60 50' role='img' aria-label='Заполненный квадрат'><rect x='17' y='12' width='26' height='26' fill='currentColor'/></svg>|<svg viewBox='0 0 60 50' role='img' aria-label='Контурный квадрат'><rect x='17' y='12' width='26' height='26' fill='none' stroke='currentColor' stroke-width='3'/></svg>|<svg viewBox='0 0 60 50' role='img' aria-label='Заполненный круг'><circle cx='30' cy='25' r='14' fill='currentColor'/></svg>",1,"Во второй колонке контурная фигура становится заполненной.","<svg viewBox='0 0 240 150' role='img' aria-label='Верхний ряд: контурный круг, заполненный круг. Нижний: контурный квадрат, пропуск.'><g fill='none' stroke='#536175'><rect x='12' y='8' width='100' height='63' rx='8'/><rect x='128' y='8' width='100' height='63' rx='8'/><rect x='12' y='79' width='100' height='63' rx='8'/><rect x='128' y='79' width='100' height='63' rx='8'/></g><circle cx='62' cy='39' r='18' fill='none' stroke='currentColor' stroke-width='3'/><circle cx='178' cy='39' r='18' fill='currentColor'/><rect x='45' y='93' width='34' height='34' fill='none' stroke='currentColor' stroke-width='3'/><text x='178' y='121' font-size='30' text-anchor='middle' fill='currentColor'>?</text></svg>"],[2,"Куб 3 × 3 × 3 окрашен снаружи и разделён на 27 одинаковых кубиков. Сколько кубиков имеют ровно две окрашенные грани?","8|6|12|18",2,"На каждом из 12 рёбер есть один средний кубик."],[2,"Точка движется на 2 клетки вверх, 3 вправо, 1 вниз и 3 влево. Где она относительно старта?","1 справа|1 снизу|2 сверху|1 сверху",3,"Горизонтальные шаги компенсируются, вертикальные дают одну клетку вверх."],[2,"Отразите направление ↗ относительно вертикальной оси.","↖|↘|↙|↗",0,"Горизонтальная компонента меняет знак, вертикальная сохраняется."],[2,"Лист сложили пополам дважды: сначала слева направо, затем снизу вверх. Вдали от сгибов пробили одно отверстие. Сколько отверстий после разворачивания?","2|4|6|8",1,"Каждый сгиб удваивает количество симметричных отверстий."],[2,"Какая грань противоположна A в показанной развёртке куба?","B|C|D|E",1,"Полоса A–B–C–D образует четыре боковые грани; A противоположна C.","<svg viewBox='0 0 240 180' role='img' aria-label='Горизонтальный ряд A B C D, E над B, F под B.'><g fill='#243746' stroke='#95bfe3' stroke-width='2'><rect x='20' y='65' width='50' height='50'/><text x='45' y='96' text-anchor='middle' fill='#eff6ff' stroke='none' font-size='21'>A</text><rect x='70' y='65' width='50' height='50'/><text x='95' y='96' text-anchor='middle' fill='#eff6ff' stroke='none' font-size='21'>B</text><rect x='120' y='65' width='50' height='50'/><text x='145' y='96' text-anchor='middle' fill='#eff6ff' stroke='none' font-size='21'>C</text><rect x='170' y='65' width='50' height='50'/><text x='195' y='96' text-anchor='middle' fill='#eff6ff' stroke='none' font-size='21'>D</text><rect x='70' y='15' width='50' height='50'/><text x='95' y='46' text-anchor='middle' fill='#eff6ff' stroke='none' font-size='21'>E</text><rect x='70' y='115' width='50' height='50'/><text x='95' y='146' text-anchor='middle' fill='#eff6ff' stroke='none' font-size='21'>F</text></g></svg>"],[2,"В квадратной сетке 3 × 3 клеток сколько всего квадратов со сторонами по линиям сетки?","9|10|13|14",3,"9 квадратов 1 × 1, 4 квадрата 2 × 2 и один 3 × 3."],[3,"Книга относится к чтению так же, как музыкальный инструмент к…","Исполнению музыки|Хранению|Измерению|Рисованию",0,"Предмет соотнесён со своим основным использованием."],[3,"Найдите слово, не относящееся к остальным по геометрической размерности.","Треугольник|Куб|Квадрат|Круг",1,"Куб объёмный, остальные фигуры плоские."],[3,"Термометр — температура; барометр — ?","Время|Скорость|Атмосферное давление|Влажность",2,"Оба прибора соотносятся с измеряемой величиной."],[3,"Какое слово противоположно слову «расширение»?","Увеличение|Удлинение|Растяжение|Сужение",3,"Сужение означает уменьшение ширины или объёма."],[3,"Дерево — лес; звезда — ?","Звёздное скопление|Орбита|Планета|Телескоп",0,"Отдельный объект соотносится с группой таких объектов."],[3,"Какое слово означает способность менять решение при появлении новых аргументов?","Непреклонность|Гибкость|Импульсивность|Поспешность",1,"Гибкость мышления позволяет корректировать выводы на основе новой информации."],[3,"Минута — час; сантиметр — ?","Грамм|Литр|Метр|Секунда",2,"Меньшая единица соотносится с большей единицей той же величины."],[3,"Найдите лишнее слово по типу действия: сравнивать, сопоставлять, соотносить, запоминать.","Сравнивать|Сопоставлять|Соотносить|Запоминать",3,"Первые три обозначают установление отношений; запоминание — сохранение информации."]], NAMES=["Числовое","Логическое","Пространственное","Вербальное"], COLORS=["#77baff","#79e2bb","#ffd182","#c4a8ff"];
const KEY="yugatneo-iq-v2", HK=KEY+"-history", app=document.getElementById("app"), $=id=>document.getElementById(id);
function get(k,def){try{return JSON.parse(localStorage.getItem(k))??def}catch{return def}}
function set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch{return false}}
function del(k){try{localStorage.removeItem(k)}catch{}}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function make(mode){let ids=NAMES.flatMap((_,c)=>shuffle(BANK.map((q,i)=>q[0]===c?i:-1).filter(i=>i>=0)).slice(0,mode==="quick"?4:8));ids=shuffle(ids);return {mode,ids,orders:ids.map(()=>shuffle([0,1,2,3])),answers:ids.map(()=>null),pos:0,start:Date.now(),limit:mode==="quick"?720000:mode==="full"?1440000:0}}
function valid(s){return s&&["quick","full","practice"].includes(s.mode)&&Array.isArray(s.ids)&&s.ids.length===(s.mode==="quick"?16:32)&&new Set(s.ids).size===s.ids.length&&s.ids.every(i=>Number.isInteger(i)&&i>=0&&i<BANK.length)&&Array.isArray(s.answers)&&s.answers.length===s.ids.length&&s.answers.every(a=>a===null||[0,1,2,3].includes(a))&&Array.isArray(s.orders)&&s.orders.length===s.ids.length&&s.orders.every(o=>Array.isArray(o)&&o.length===4&&new Set(o).size===4&&o.every(i=>[0,1,2,3].includes(i)))&&Number.isInteger(s.pos)&&s.pos>=0&&s.pos<s.ids.length&&Number.isFinite(s.start)&&s.limit===(s.mode==="quick"?720000:s.mode==="full"?1440000:0)}
function evaluate(s){const by=NAMES.map(()=>({right:0,total:0}));let answered=0; s.ids.forEach((id,i)=>{const q=BANK[id],b=by[q[0]];b.total++;if(s.answers[i]!==null)answered++;if(s.answers[i]===q[3])b.right++});return {by,answered,right:by.reduce((a,b)=>a+b.right,0),total:s.ids.length}}
let state=null,timer=null,screen="intro";
function fmt(ms){let s=Math.max(0,Math.ceil(ms/1000));return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")}
function save(){set(KEY,state)}
function start(m){state=make(m);screen="test";save();render();clearInterval(timer);timer=setInterval(tick,250)}
function intro(){clearInterval(timer);screen="intro";const old=get(KEY,null),hist=get(HK,[]);app.innerHTML='<section class="panel"><div class="tag">Когнитивный тренажёр</div><h1>IQ Lab</h1><p>Исследуйте четыре направления мышления. Выберите режим, решайте задания самостоятельно и сравнивайте результаты только в рамках этого тренажёра.</p><div class="mode"><button class="primary" id="quick">Экспресс<small>16 заданий · 12 минут</small></button><button id="full">Полный тест<small>32 задания · 24 минуты</small></button><button id="practice">Тренировка<small>32 задания · без ограничения времени</small></button></div><p>Задания и варианты перемешиваются. Можно менять ответы и возвращаться к пропущенным вопросам. Итог и объяснения открываются после завершения.</p><small>Не стандартизированный IQ-тест: процент правильных ответов не является коэффициентом IQ. Повторное прохождение знакомых заданий влияет на результат.</small></section>';
if(valid(old)){app.insertAdjacentHTML("beforeend",'<section class="panel"><h2>Незавершённая попытка</h2><p>Отвечено '+old.answers.filter(a=>a!==null).length+' из '+old.ids.length+'. Время продолжает идти после закрытия страницы.</p><div class="nav"><button id="resume" class="primary">Продолжить</button><button id="discard">Удалить попытку</button></div></section>');$("resume").onclick=()=>{state=old;screen="test";render();clearInterval(timer);if(screen==="test")timer=setInterval(tick,250)};$("discard").onclick=()=>{if(confirm("Удалить сохранённую попытку?")){del(KEY);intro()}}}
if(Array.isArray(hist)&&hist.length){app.insertAdjacentHTML("beforeend",'<section class="panel"><div class="row"><h2>История попыток</h2><button id="clearHistory">Очистить</button></div><div id="hist" class="history"></div><small>Хранятся на этом устройстве. Разные режимы и наборы вопросов не эквивалентны.</small></section>');hist.slice(0,10).forEach(h=>{const d=document.createElement("div");d.textContent=new Date(h.date).toLocaleString("ru-RU")+" · "+({quick:"Экспресс",full:"Полный",practice:"Тренировка"}[h.mode]||"Тест")+" · "+h.right+"/"+h.total+" · "+fmt(h.elapsed);$("hist").append(d)});$("clearHistory").onclick=()=>{if(confirm("Удалить историю?")){del(HK);intro()}}}
["quick","full","practice"].forEach(m=>$(m).onclick=()=>{if(valid(old)&&!confirm("Начать новую попытку вместо сохранённой?"))return;start(m)})}
function tick(){if(screen!=="test")return;const e=Math.max(0,Date.now()-state.start), left=state.limit?state.limit-e:e,clock=$("clock");if(clock){clock.textContent=fmt(left);clock.classList.toggle("warning",!!state.limit&&left<=60000)}if(state.limit&&left<=0)finish("Время истекло")}
function go(p){if(screen!=="test"||p<0||p>=state.ids.length)return;state.pos=p;save();render()}
function render(){if(screen!=="test")return;const s=state,i=s.pos,q=BANK[s.ids[i]],opts=q[2].split("|"),n=s.ids.length,done=s.answers.filter(a=>a!==null).length;app.innerHTML='<section class="panel"><div class="row"><span class="tag">Задание '+(i+1)+' / '+n+'</span><strong id="clock" class="clock" aria-label="Время"></strong></div><div class="progress" role="progressbar" aria-valuenow="'+done+'" aria-valuemax="'+n+'"><i style="width:'+done/n*100+'%"></i></div><div class="row"><small style="color:'+COLORS[q[0]]+'">'+NAMES[q[0]]+' мышление</small><small>Отвечено '+done+'/'+n+'</small></div><h2>'+q[1]+'</h2>'+(q[5]?'<div class="visual">'+q[5]+'</div>':'')+'<div class="answers">'+s.orders[i].map((k,j)=>'<button data-choice="'+k+'" aria-pressed="'+(s.answers[i]===k)+'"><span class="letter">'+(j+1)+'</span>'+opts[k]+'</button>').join("")+'</div><div class="nav"><button id="prev" '+(i===0?'disabled':'')+'>Назад</button><button id="skip">Пропустить</button><button class="primary" id="next">'+(i===n-1?'К итогу':'Далее')+'</button></div><div class="grid">'+s.ids.map((_,j)=>'<button data-pos="'+j+'" aria-label="Задание '+(j+1)+'" class="'+(s.answers[j]!==null?'done ':'')+(i===j?'current':'')+'">'+(j+1)+'</button>').join("")+'</div><div class="nav"><button id="exit">Выйти и сохранить</button><button id="finish">Завершить</button></div><div id="confirm"></div><small>Клавиши 1–4 — ответ; ← / → — переход.</small></section>';
app.querySelectorAll("[data-choice]").forEach(b=>b.onclick=()=>choose(+b.dataset.choice));app.querySelectorAll("[data-pos]").forEach(b=>b.onclick=()=>go(+b.dataset.pos));$("prev").onclick=()=>go(i-1);$("next").onclick=()=>i===n-1?requestFinish():go(i+1);$("skip").onclick=()=>{s.answers[i]=null;save();i===n-1?requestFinish():go(i+1)};$("finish").onclick=requestFinish;$("exit").onclick=()=>{save();intro()};tick()}
function choose(k){if(screen!=="test")return;state.answers[state.pos]=k;save();render()}
function requestFinish(){if(screen!=="test")return;const n=state.answers.filter(a=>a===null).length;if(!n){finish("Завершено");return}$("confirm").innerHTML='<p class="warning">Без ответа: '+n+'. Пропуски дают 0 баллов.</p><div class="nav"><button id="cancel">Продолжить</button><button class="primary" id="yes">Подтвердить</button></div>';$("cancel").onclick=()=>{$("confirm").innerHTML=""};$("yes").onclick=()=>finish("Завершено")}
function radar(by){const p=(i,f)=>[180+Math.sin(i*Math.PI/2)*105*f,147-Math.cos(i*Math.PI/2)*105*f];const pts=f=>NAMES.map((_,i)=>p(i,f).join(",")).join(" ");return '<svg viewBox="0 0 360 294" role="img" aria-label="Диаграмма результатов по четырём направлениям">'+[.25,.5,.75,1].map(f=>'<polygon points="'+pts(f)+'" fill="none" stroke="#536175"/>').join("")+NAMES.map((_,i)=>'<line x1="180" y1="147" x2="'+p(i,1)[0]+'" y2="'+p(i,1)[1]+'" stroke="#536175"/>').join("")+'<polygon points="'+by.map((b,i)=>p(i,b.right/b.total).join(",")).join(" ")+'" fill="#79e2bb44" stroke="#79e2bb" stroke-width="2"/>'+by.map((b,i)=>'<circle cx="'+p(i,b.right/b.total)[0]+'" cy="'+p(i,b.right/b.total)[1]+'" r="4" fill="'+COLORS[i]+'"/>').join("")+NAMES.map((n,i)=>{const xy=[[180,23],[310,151],[180,280],[50,151]][i];return '<text x="'+xy[0]+'" y="'+xy[1]+'" fill="'+COLORS[i]+'" font-size="12" text-anchor="middle">'+n+'</text>'}).join("")+'</svg>'}
function finish(reason){if(screen!=="test")return;clearInterval(timer);screen="result";const s=state, r=evaluate(s),pct=Math.round(r.right/r.total*100),elapsed=Math.max(0,Math.min(s.limit||Infinity,Date.now()-s.start));del(KEY);let hist=get(HK,[]);if(!Array.isArray(hist))hist=[];set(HK,[{date:Date.now(),mode:s.mode,right:r.right,total:r.total,elapsed},...hist].slice(0,20));app.innerHTML='<section class="panel"><span class="tag">'+reason+'</span><h1>Профиль мышления</h1><div class="result"><div class="ring" style="background:conic-gradient(var(--accent) '+pct+'%,var(--line) 0)"><b>'+pct+'%</b></div><div><div class="score">'+r.right+' / '+r.total+'</div><p>Правильных ответов<br>Время: '+fmt(elapsed)+' · Пропущено: '+(r.total-r.answered)+'</p></div></div><div class="radar">'+radar(r.by)+'</div>'+r.by.map((b,i)=>'<div class="row"><span>'+NAMES[i]+' мышление</span><strong>'+b.right+'/'+b.total+'</strong></div><div class="bar"><i style="background:'+COLORS[i]+';width:'+b.right/b.total*100+'%"></i></div>').join("")+'<p>Это результат конкретного набора задач, а не IQ и не диагноз. Не применяйте его для кадровых, образовательных или медицинских решений.</p><div class="nav"><button id="export">Сохранить отчёт</button><button id="again" class="primary">В меню</button></div></section><section class="panel"><h2>Разбор ответов</h2>'+s.ids.map((id,i)=>{const q=BANK[id],o=q[2].split("|"),a=s.answers[i];return '<details><summary><span class="'+(a===q[3]?'good':'bad')+'">'+(a===q[3]?'✓':a===null?'–':'×')+'</span> '+(i+1)+'. '+q[1]+'</summary>'+(q[5]?'<div class="visual">'+q[5]+'</div>':'')+'<p>Ваш ответ: '+(a===null?'Пропущено':o[a])+'</p><p class="good">Верный ответ: '+o[q[3]]+'</p><p>'+q[4]+'</p></details>'}).join("")+'</section>';$("again").onclick=intro;$("export").onclick=()=>{const text=["YUGATNEO IQ Lab","Результат: "+r.right+"/"+r.total+" ("+pct+"%)","Время: "+fmt(elapsed),...r.by.map((b,i)=>NAMES[i]+": "+b.right+"/"+b.total),"Тренировочный результат, не коэффициент IQ."].join("\n");const url=URL.createObjectURL(new Blob([text],{type:"text/plain;charset=utf-8"})),a=document.createElement("a");a.href=url;a.download="iq-lab-result.txt";document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}}
document.addEventListener("keydown",e=>{if(screen!=="test"||e.altKey||e.ctrlKey||e.metaKey||e.repeat)return;if(e.target.matches("input,textarea,select")||$("confirm")?.children.length)return;if(["1","2","3","4"].includes(e.key)){e.preventDefault();choose(state.orders[state.pos][+e.key-1])}else if(e.key==="ArrowLeft"){e.preventDefault();go(state.pos-1)}else if(e.key==="ArrowRight"){e.preventDefault();go(state.pos+1)}});
document.addEventListener("visibilitychange",()=>{if(!document.hidden)tick()});intro();
</script></body></html>
