<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Retro Station Player</title><style>html,body,#game{width:100%;height:100%;margin:0;background:#080c14;color:#e6edff;font:15px system-ui}#notice{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:18px;pointer-events:none}#notice[hidden],#standalone[hidden]{display:none}#standalone{position:absolute;inset:0;background:#111a2e;padding:20px;box-sizing:border-box;z-index:10}#standalone select,#standalone button,#standalone input{font:inherit;margin:8px 0;max-width:100%}#standalone a{color:#81acff}#notice{z-index:2}#stage{width:100%;height:100%;position:relative}#padSetup{position:absolute;z-index:1000;top:8px;left:8px;background:#17263e;color:white;border:1px solid #5a739e;padding:8px 12px;border-radius:8px;font:13px system-ui;cursor:pointer}#padSetup[hidden]{display:none}#directDisplay{margin:10px 0}#standalone{overflow:auto}</style><link rel="stylesheet" href="display.css?v=1.4"></head><body><div id="stage"><button id="padSetup" hidden>Управление (F3)</button><div id="game"></div><div id="notice">Загрузка…</div><section id="standalone" hidden><h1>Retro Station · отдельный плеер</h1><p>Резервный режим без iframe и общей библиотеки.</p><label>Система <select id="directSystem"></select></label><p><input id="directFile" type="file"></p><label id="directBiosWrap" hidden>BIOS PS1 <input id="directBios" type="file"></label><p><button id="directStart">Запустить</button></p><p id="directStatus" role="status"></p><label><input id="autoFull" type="checkbox"> Полный экран при запуске</label><div id="directDisplay"><button id="full">Во весь экран (F2)</button></div><a href="./">Вернуться в Retro Station</a></section></div><script src="display.js?v=1.4"></script><script>
"use strict";
const SYSTEMS={"nes":["Dendy / NES / Famicom","nes zip",16],"segaMD":["Sega Mega Drive / Genesis","md gen bin smd zip",32],"segaMS":["Sega Master System","sms zip",16],"segaGG":["Sega Game Gear","gg zip",16],"snes":["Super Nintendo / Super Famicom","sfc smc zip",32],"gba":["Game Boy Advance","gba zip",64],"psx":["PlayStation 1","chd pbp iso bin zip",800]}, CDN="https://cdn.emulatorjs.org/4.2.3/data/",VERSION="4.2.3";
let current=null,started=false,auto=true,interval=null,safeToSave=false;const direct=window.parent===window;let coreTimeout=null,display=null;
function send(type,extra={}){if(direct)return;parent.postMessage({type,session:current?.session,...extra},location.origin)}
function status(state,text){display?.notice(state==="error"||state==="loading"?text:"");if(state==="ready"||state==="running"||state==="error"||state==="exit")clearTimeout(coreTimeout);if(direct)document.getElementById("directStatus").textContent=text;send("retro-status",{state,text})}
function error(text){if(direct){document.getElementById("standalone").hidden=false;document.getElementById("directStart").disabled=true;document.getElementById("directStatus").textContent=text+" Обновите страницу для новой попытки."}document.getElementById("notice").hidden=false;document.getElementById("notice").textContent=text;status("error",text)}
function openControls(){const e=window.EJS_emulator,button=e?.elements?.bottomBar?.gamepad?.[0];if(started&&button&&typeof button.click==="function"){button.click();return true}status("ready","Сначала запустите игру, затем откройте управление (F3).");return false}
document.getElementById("padSetup").onclick=openControls;document.addEventListener("keydown",e=>{if(e.key==="F3"&&started){e.preventDefault();e.stopImmediatePropagation();openControls()}},true);
function manager(){return window.EJS_emulator?.gameManager}
async function snapshot(request=null){try{if(!started||!safeToSave)throw Error("Игра не готова к сохранению.");const gm=manager();if(typeof gm?.getState!=="function")throw Error("Ядро не предоставляет состояние.");const value=await gm.getState();const bytes=value instanceof ArrayBuffer?new Uint8Array(value):ArrayBuffer.isView(value)?new Uint8Array(value.buffer,value.byteOffset,value.byteLength):null;if(!bytes?.length||bytes.length>64*1048576)throw Error("Некорректный размер состояния.");send("retro-snapshot",{bytes:bytes.slice(),request,version:VERSION,id:current.id})}catch(e){send("retro-save-error",{request,text:e.message||String(e)})}}
async function restore(bytes){if(!started||!manager()||typeof manager().loadState!=="function")throw Error("Восстановление недоступно.");if(!(bytes instanceof Uint8Array)||!bytes.length||bytes.length>64*1048576)throw Error("Некорректное состояние.");await manager().loadState(bytes);safeToSave=true}
async function receive(d){if(!d||typeof d.type!=="string")return;
 if(d.type==="retro-init"&&!current){const s=SYSTEMS[d.core];if(!s||!(d.file instanceof Blob)||!d.file.size||d.file.size>s[2]*1048576||typeof d.id!=="string"||typeof d.session!=="string")return;current=d;auto=d.auto!==false;
 try{Object.assign(window,{EJS_player:"#game",EJS_core:d.core,EJS_gameUrl:d.file instanceof File?d.file:new File([d.file],d.name||"cartridge."+s[1].split(" ")[0]),EJS_gameName:d.id.replace(":","-"),EJS_gameID:parseInt(d.id.split(":").pop().slice(0,8),16),EJS_pathtodata:CDN,EJS_biosUrl:d.bios instanceof Blob?(d.bios instanceof File?d.bios:new File([d.bios],"bios.bin")):"",EJS_threads:false,EJS_disableDatabases:true,EJS_startOnLoaded:false,EJS_language:"ru-RU",EJS_disableAutoLang:true,EJS_color:"#6596ff",EJS_backgroundColor:"#080c14",EJS_askBeforeExit:false,EJS_volume:0.5,EJS_startButtonName:"Начать игру",EJS_ready:()=>{document.getElementById("notice").hidden=true;status("ready","Ядро готово. Нажмите «Начать игру».")},EJS_onGameStart:async()=>{clearTimeout(coreTimeout);if(started)return;started=true;document.getElementById("padSetup").hidden=false;document.getElementById("notice").hidden=true;try{if(d.resume){await restore(d.resume);status("running","Последнее состояние восстановлено.")}else{safeToSave=true;status("running","Игра запущена.")}}catch(e){safeToSave=false;status("running","Не удалось восстановить состояние. Автосохранение заблокировано до ручного сохранения.")}interval=setInterval(()=>{if(auto&&safeToSave)snapshot()},30000)},EJS_onExit:()=>{document.getElementById("padSetup").hidden=true;started=false;safeToSave=false;clearInterval(interval);status("exit","Игра завершена.")}});
 const script=document.createElement("script");script.src=CDN+"loader.js";script.onerror=()=>error("Ядро недоступно. Подключитесь к интернету или проверьте офлайн-кэш.");document.head.append(script);status("loading","Загрузка ядра и образа…");coreTimeout=setTimeout(()=>{if(!window.EJS_emulator)error("Ядро не инициализировалось за 45 секунд. Проверьте CDN и доступ к интернету.")},45000);
 }catch(e){error(e.message||String(e))}return}
 if(!current||d.session!==current.session)return;
 if(d.type==="retro-save"){if(d.manual&&started)safeToSave=true;await snapshot(d.request)}
 if(d.type==="retro-controls")openControls();
 if(d.type==="retro-auto")auto=!!d.enabled;
 if(d.type==="retro-restore"){try{await restore(d.bytes);status("running","Состояние восстановлено.")}catch(err){status("running","Ошибка восстановления: "+err.message)}}
}
window.addEventListener("message",e=>{if(!direct&&e.origin===location.origin&&e.source===parent)receive(e.data)});
if(!direct)document.addEventListener("keydown",e=>{if(e.key==="F2"){e.preventDefault();send("retro-display-toggle")}else if(e.key==="Escape"&&!document.fullscreenElement)send("retro-display-exit")});
window.addEventListener("error",e=>{if(current&&!started&&e.message)error("Ошибка загрузчика: "+e.message)});
window.addEventListener("unhandledrejection",e=>{if(current&&!started)error("Ошибка инициализации: "+(e.reason?.message||String(e.reason||"неизвестная")))});
document.addEventListener("visibilitychange",()=>{if(document.hidden&&auto&&safeToSave)snapshot()});
window.addEventListener("pagehide",()=>clearInterval(interval));
if(!direct)parent.postMessage({type:"retro-player-ready"},location.origin);
else{
 const $=id=>document.getElementById(id),params=new URLSearchParams(location.search),select=$("directSystem");
 for(const [k,s] of Object.entries(SYSTEMS)){const o=document.createElement("option");o.value=k;o.textContent=s[0];select.append(o)}
 const wanted=params.get("system");select.value=Object.prototype.hasOwnProperty.call(SYSTEMS,wanted)?wanted:"nes";
 function syncDirect(){$("directFile").accept=SYSTEMS[select.value][1].split(" ").map(x=>"."+x).join(",");$("directBiosWrap").hidden=select.value!=="psx"}
 select.onchange=syncDirect;syncDirect();$("standalone").hidden=false;$("notice").hidden=true;if(window.RetroDisplay){display=RetroDisplay.create($("stage"));$("autoFull").checked=RetroDisplay.getPreference();$("autoFull").onchange=()=>RetroDisplay.setPreference($("autoFull").checked);$("full").onclick=()=>display.toggle()}
 async function directLaunch(file,core,bios){const sys=SYSTEMS[core];if(!file||!file.size||file.size>sys[2]*1048576||!sys[1].split(" ").includes(file.name.split(".").pop().toLowerCase()))throw Error("Неподходящий ROM.");if(core==="psx"&&bios?.size!==524288)throw Error("Выберите BIOS размером 512 КиБ.");const hash=Array.from(new Uint8Array(await crypto.subtle.digest("SHA-256",await file.arrayBuffer())),x=>x.toString(16).padStart(2,"0")).join("");$("standalone").hidden=true;$("notice").hidden=false;await receive({type:"retro-init",id:core+":"+hash,session:"direct",file,core,bios,auto:false})}
 $("directStart").onclick=async()=>{if($("directFile").files[0])display?.auto();try{await directLaunch($("directFile").files[0],select.value,$("directBios").files[0])}catch(e){$("directStatus").textContent=e.message}};
 const game=params.get("game");
 if(["2048","pixel-viper","robotfindskitten","rhde","gba-pong","gba-rkanoid","gba-cascade7"].includes(game)){display?.auto(false);(async()=>{try{$("directStatus").textContent="Загрузка встроенного ROM…";const res=await fetch("roms/"+game+".b64");if(!res.ok)throw Error("HTTP "+res.status);const bytes=Uint8Array.from(atob((await res.text()).replace(/\s/g,"")),c=>c.charCodeAt(0));const platform=game.startsWith("gba-")?"gba":"nes";await directLaunch(new File([bytes],game+"."+platform),platform,null)}catch(e){$("directStatus").textContent=e.message}})()}
}
</script></body></html>
