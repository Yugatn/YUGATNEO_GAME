name: SYMBIONT CITY Lifespan Educational Mini App tests
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  logic-and-mobile-ui:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test-only browser DOM simulator
        run: npm install --no-save --no-audit --no-fund jsdom@26.1.0
      - name: Verify all application scripts are valid
        run: |
          node --check symbiont-city/content.js
          node --check symbiont-city/engine.js
          node --check symbiont-city/game.js
          node --check symbiont-city/decisions.js
          node --check symbiont-city/decisions-ui.js
          node --check symbiont-city/sw.js
      - name: All 0-110 age and full-game scenario tests
        run: node --test tests/symbiont-city.test.cjs tests/symbiont-city-ui.test.cjs tests/symbiont-city-decisions.test.cjs tests/symbiont-city-decisions-ui.test.cjs

  responsive-browser:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test runner
        run: npm install --no-save --no-audit --no-fund playwright@1.55.1
      - name: Select system Chrome
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            echo "CHROME_BIN=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - name: Check interactive city and age-specific gameplay in Chromium
        run: node --test tests/symbiont-city-browser.test.cjs
      - name: Save mobile and desktop previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: symbiont-city-responsive-screenshots
          path: test-artifacts/symbiont-city/
          if-no-files-found: ignore
