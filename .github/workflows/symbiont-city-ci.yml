name: SYMBIONT CITY Lifespan Educational Mini App tests
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  logic-and-mobile-ui:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test-only browser DOM simulator
        run: npm install --no-save --no-audit --no-fund jsdom@26.1.0
      - name: Verify all application scripts are valid
        run: |
          node --check symbiont-city/content.js
          node --check symbiont-city/engine.js
          node --check symbiont-city/game.js
          node --check symbiont-city/sw.js
      - name: All 0-110 age and full-game scenario tests
        run: node --test tests/symbiont-city.test.cjs tests/symbiont-city-ui.test.cjs
