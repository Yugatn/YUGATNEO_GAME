name: LABYRINTH X Telegram Mini App tests
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  maze-tests:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser simulator
        run: npm install --no-save --no-audit --no-fund jsdom@26.1.0
      - name: Validate JavaScript
        run: |
          node --check maze-x/engine.js
          node --check maze-x/game.js
          node --check maze-x/sw.js
      - name: Verify maze generation, escape paths and UI
        run: node --test tests/maze-x.test.cjs tests/maze-x-ui.test.cjs
