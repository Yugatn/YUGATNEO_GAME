name: Trading X smoke tests

on:
  push:
    branches: [main]
    paths:
      - 'trading-x/**'
      - '.github/workflows/trading-x-tests.yml'
  pull_request:
    paths:
      - 'trading-x/**'
      - '.github/workflows/trading-x-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Dependency-free regression tests
        run: node trading-x/tests/smoke.cjs
